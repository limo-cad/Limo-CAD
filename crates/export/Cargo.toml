[package]
name = "limo-cad-export"
version.workspace = true
edition.workspace = true
description = "Limo CAD manufacturing mesh writers (STL, 3MF)"
license = "LGPL-2.1-or-later"
repository.workspace = true

[dependencies]
roxmltree.workspace = true
limo-cad-core = { path = "../core" }
limo-cad-assembly = { path = "../assembly" }
limo-cad-solid = { path = "../solid" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zip = { workspace = true, features = ["deflate"] }

[features]
test-utils = []

[dev-dependencies]
limo-cad-sketch = { path = "../sketch" }
