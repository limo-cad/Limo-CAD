[package]
name = "limo-cad-occt"
version.workspace = true
edition.workspace = true
description = "Native Open CASCADE adapter for Limo CAD"
license = "LGPL-2.1-or-later"
repository.workspace = true

[features]
default = []
native-occt = ["dep:cxx", "dep:cxx-build"]

[dependencies]
limo-cad-assembly = { path = "../assembly" }
limo-cad-sketch = { path = "../sketch" }
cxx = { workspace = true, optional = true }
limo-cad-core = { path = "../core" }
limo-cad-solid = { path = "../solid" }
limo-cad-export = { path = "../export" }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
ttf-parser.workspace = true
usvg = { workspace = true, features = ["text", "system-fonts"] }
unicode-segmentation.workspace = true

[build-dependencies]
cxx-build = { workspace = true, optional = true }
