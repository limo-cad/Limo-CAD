[package]
name = "limo-cad-kernel"
version.workspace = true
edition.workspace = true
description = "Data-oriented analytic B-rep kernel for Limo CAD (pure Rust, no native dependencies)"
license = "LGPL-2.1-or-later"
repository.workspace = true

[features]
default = ["dto"]
# Adapter between the kernel and the host-neutral solid contract
# (`RecomputePlanDto` in, `KernelSceneDto` out).
dto = ["dep:limo-cad-core", "dep:limo-cad-solid"]

[dependencies]
limo-cad-core = { path = "../core", optional = true }
limo-cad-solid = { path = "../solid", optional = true }

[dev-dependencies]
serde_json.workspace = true
