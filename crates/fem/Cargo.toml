[package]
name = "limo-cad-fem"
version.workspace = true
edition.workspace = true
license = "LGPL-2.1-or-later"
repository.workspace = true
description = "Finite element analysis kernels over shared Limo CAD material models"

[dependencies]
limo-cad-core = { path = "../core" }

serde = { workspace = true, features = ["derive"] }
ciborium = "=0.2.2"
[dev-dependencies]
cddl-cat = { version = "=0.7.1", default-features = false, features = ["ciborium"] }
