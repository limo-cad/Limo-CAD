[package]
name = "nbcad"
default-run = "nbcad"
version = "0.1.0"
edition = "2021"
description = "noBS CAD desktop shell (Tauri 2)"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jackControls/noBS-CAD"

# The src-tauri crate is its own workspace so `cargo test` at the repo root
# stays engine-only; engine crates are shared by path dependency.
[workspace]

[lib]
name = "nbcad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Tauri's CLI enables this feature for release builds so the web shell is
# loaded from the assets embedded by `tauri-build` instead of the Vite dev URL.
custom-protocol = ["tauri/custom-protocol"]
# Adds logging only for the headless GPU visual-regression lab. The production
# Tauri binary keeps using the embedded native view and does not include the
# capture entry point.
dev-ui-lab = ["bevy/bevy_log"]

[[bin]]
name = "bevy-ui-lab"
path = "src/bin/bevy_ui_lab.rs"
required-features = ["dev-ui-lab"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4"] }
nbcad-core = { path = "../crates/core" }
nbcad-sketch = { path = "../crates/sketch" }
nbcad-solid = { path = "../crates/solid" }
nbcad-export = { path = "../crates/export" }
nbcad-occt = { path = "../crates/occt", features = ["native-occt"] }
nbcad-mcp-mutate = { path = "../crates/mcp-mutate" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_image",
  "bevy_light",
  "bevy_material",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "default_font",
  "hdr",
  "multi_threaded",
  "png",
  "std",
  "tonemapping_luts",
  "zstd_rust",
] }
bevy_ecs = "0.19.0"
bevy_gizmos = "0.19.0"
bevy_reflect = "0.19.0"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK/WebKitGTK remain the React/Tauri shell. An X11 child DrawingArea beneath
# the transparent webview is the native wgpu surface, matching the opaque-window
# architecture used on macOS and Windows without a second top-level window.
# Ubuntu's Wayland desktop reaches this child-window path through XWayland.
gdk = "0.18.2"
gdkx11-sys = "0.18.2"
glib = "0.18.5"
gtk = "0.18.2"
webkit2gtk = "2.0.2"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGGeometry", "CGPath"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
# Keep gpu-allocator and wgpu-hal on the same Direct3D COM types. Version 0.62.0
# is the exact intersection of gpu-allocator's `<=0.62` cap and wgpu-hal's
# `^0.62` requirement; allowing a newer patch release makes Cargo split them.
windows = { version = "=0.62.0", default-features = false }
webview2-com = "0.38.2"
windows-core-webview2 = { package = "windows-core", version = "0.61" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
