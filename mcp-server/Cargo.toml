[package]
name = "limo-cad-mcp"
version = "0.2.2"
edition = "2021"
description = "Headless MCP stdio server for Limo CAD sketch and solid tools"
license = "LGPL-2.1-or-later"
repository = "https://github.com/limo-cad/Limo-CAD"

[workspace]

[lib]
name = "limo_cad_mcp"

[features]
default = []
native-computer-control = [
    "dep:enigo",
    "dep:windows-capture",
    "windows-sys/Win32_Graphics_Dwm",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_UI_HiDpi",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]

[dependencies]
limo-cad-session-storage = { path = "../crates/session-storage" }
limo-cad-build-info = { path = "../crates/build-info" }
limo-cad-interface = { path = "../crates/interface" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
limo-cad-script = { path = "../crates/script" }
limo-cad-recipes = { path = "../crates/recipes" }
limo-cad-help = { path = "../crates/help" }
limo-cad-core = { path = "../crates/core" }
limo-cad-sketch = { path = "../crates/sketch" }
limo-cad-solid = { path = "../crates/solid" }
limo-cad-export = { path = "../crates/export" }
limo-cad-occt = { path = "../crates/occt", features = ["native-occt"] }
limo-cad-mcp-mutate = { path = "../crates/mcp-mutate" }
limo-cad-print = { path = "../crates/print" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
enigo = { version = "=0.6.1", default-features = false, optional = true }
windows-capture = { version = "=2.0.1", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[dev-dependencies]
limo-cad-export = { path = "../crates/export", features = ["test-utils"] }
jsonschema = { version = "0.58.4", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
