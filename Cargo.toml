# noBS CAD engine workspace. The host-neutral crates own document and
# history semantics; `crates/occt` is the native B-rep adapter (D1/D8).
# The Tauri shell in src-tauri/ is intentionally its own workspace so that
# `cargo test` at the repo root only builds/tests the engine crates.

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/assembly",
    "crates/cam",
    "crates/sketch",
    "crates/solid",
    "crates/occt",
    "crates/export",
    "crates/mcp-mutate",
    "crates/script",
    "crates/recipes",
    "crates/help",
    "crates/print",
    "crates/wasm",
    "xtask",
]

# The repository version lives in VERSION and is propagated here by
# `node scripts/sync-version.mjs`; every member inherits it.
[workspace.package]
version = "0.2.2"

# Bevy's development starting point: retain development checks while avoiding
# unoptimized solver and dependency work. Workspace members use level 1.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = 0
