
[workspace]
resolver = "2"
members = [
    "crates/build-info",
    "crates/interface",
    "crates/project-file",
    "crates/core",
    "crates/fem",
    "crates/assembly",
    "crates/cam",
    "crates/sketch",
    "crates/session-storage",
    "crates/session-publication",
    "crates/solid",
    "crates/occt",
    "crates/native-engine",
    "crates/export",
    "crates/mcp-mutate",
    "crates/script",
    "crates/recipes",
    "crates/help",
    "crates/print",
    "crates/wasm",
    "xtask",
]

[workspace.package]
repository = "https://github.com/limo-cad/Limo-CAD"
version = "0.3.0-rc.3"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cxx = "1.0.205"
cxx-build = "1.0.205"
earcutr = "0.5.0"
flate2 = { version = "1.1.10", default-features = false }
js-sys = "0.3.106"
png = "0.18.1"
regex = "1.13.1"
roxmltree = "0.21.1"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false }
tar = "0.4.46"
tempfile = "3.27.0"
time = "0.3.55"
toml_edit = "0.25.17"
ttf-parser = "=0.25.1"
unicode-segmentation = "=1.13.3"
ureq = "3.4.2"
usvg = { version = "=0.49.0", default-features = false }
wasm-bindgen = "0.2.129"
wasm-bindgen-test = "0.3.79"
windows = { version = "=0.62.2", default-features = false }
# Retain the 9.1 EOCD fix without 9.1.3's eager metadata allocation.
zip = { version = "=9.1.2", default-features = false }

# Bevy's development starting point: retain development checks while avoiding
# unoptimized solver and dependency work. Workspace members use level 1.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = 0
