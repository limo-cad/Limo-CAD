[package]
name = "limo-simulation-experiment"
version = "0.1.0"
edition = "2021"
publish = false

# A deliberately separate workspace: no solver dependencies enter the CAD app.
[workspace]

[dependencies]
anyhow = "=1.0.104"
fenris = "=0.0.33"
fenris-solid = "=0.0.33"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
rapier3d-f64 = { version = "=0.36.1", features = ["fem", "enhanced-determinism"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[patch.crates-io]
# Published Fenris 0.0.33 numerical code with unused mesh import/export opt-in.
# Keep its registry subcrates and numerical test coverage unchanged.
fenris = { git = "https://github.com/jeffglousher/fenris", rev = "7af02be918928cb0b250275a3e09cda1f307f156" }

# Numerical kernels need optimization even for the development experiment.
[profile.dev]
opt-level = 2
debug = 0

[profile.dev.package."*"]
opt-level = 0

[profile.dev.package.rapier3d-f64]
opt-level = 2
