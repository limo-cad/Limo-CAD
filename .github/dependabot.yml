version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /desktop
      - /mcp-server
      - /experiments/rust-simulation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-workspaces:
        patterns: ["*"]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns: ["*"]
