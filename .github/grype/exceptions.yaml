# Release advisory exceptions for grype. `cargo xtask advisory-exceptions`
# runs before every scan that loads this file and fails unless each rule
# equals one unexpired entry in reviews.yaml (advisory, package name, version,
# type and location) and has a row in docs/security/dependencies.md. No other
# grype option or rule field is accepted here.
ignore:
  - vulnerability: CVE-2026-85091
    reason: >-
      The retained rc.2 evidence found no gz* imports from zlib 1.3.2;
      rc.3 requires its own packaged-binary check. This temporary decision
      covers only the listed builds. See docs/security/dependencies.md.
    package:
      name: zlib
      version: 1.3.2
      type: binary
      location: "**/Limo-CAD-0.3.0-rc.2-windows-x64/z.dll"
