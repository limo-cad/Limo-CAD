name: Bug report
description: Something broke in modeling, UI, MCP, or packaging — edge cases and weird geometry are very welcome
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - sketch
        - solid
        - viewport
        - mcp
        - packaging
        - docs
        - other
    validations:
      required: true
  - type: dropdown
    id: edge_case
    attributes:
      label: Is this an edge case?
      description: Unusual geometry, extreme values, or an uncommon tool combination? Edge-case reports become regression tests.
      options:
        - "Yes — weird geometry or corner case"
        - "Not sure"
        - "No — ordinary workflow"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to build?
      description: A sentence about the part helps us understand the intent behind the geometry
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a new project if possible
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / build
      placeholder: e.g. Windows 11, main @ abc1234
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Screenshot, short recording, or a safe .limo file — plus a STEP backup if the geometry matters
