name: Set up pinned release SBOM tools
description: Install Syft and cargo-auditable without running dependency lifecycle scripts.
runs:
  using: composite
  steps:
    - name: Install pinned Syft
      id: syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.54.1
    - name: Select SBOM executable
      shell: bash
      env:
        LIMO_SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
      run: echo "SYFT_BINARY=$LIMO_SYFT_BINARY" >> "$GITHUB_ENV"
    - name: Install verified cargo-auditable 0.7.7
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=x86_64-unknown-linux-musl.tar.xz; digest=7676443367c5e33d9fb22acef63cccb5e9202de12dae1b0579995eb3e2bc7a18 ;;
          macOS/ARM64) asset=aarch64-apple-darwin.tar.xz; digest=a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72 ;;
          macOS/X64) asset=x86_64-apple-darwin.tar.xz; digest=4b87f06ea13d32466bbc68b1f5715ac11753a052d9935245380bddce8a3f0e50 ;;
          Windows/X64) asset=x86_64-pc-windows-msvc.zip; digest=717ba2d3ed7997c501e9987ee7c94bebf9d7219b18b185a03009420ec7029c7d ;;
          Windows/ARM64) asset=aarch64-pc-windows-msvc.zip; digest=ad827b9c8e94de85930ba32a52d5ab5873e7b54148b4e415279b8d5f3f9eb917 ;;
          *) echo "Unsupported SBOM tool platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        tool_dir="$RUNNER_TEMP/limo-release-sbom-tools"
        mkdir -p "$tool_dir"
        archive="$tool_dir/cargo-auditable.$asset"
        curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
          "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/cargo-auditable-$asset" -o "$archive"
        if [[ "$RUNNER_OS" == macOS ]]; then
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
        else
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
        fi
        if [[ "$asset" == *.zip ]]; then
          unzip -q "$archive" -d "$tool_dir"
        else
          tar -xJf "$archive" -C "$tool_dir"
        fi
        binary="$(find "$tool_dir" -type f \( -name cargo-auditable -o -name cargo-auditable.exe \) -print -quit)"
        test -n "$binary"
        echo "$(dirname "$binary")" >> "$GITHUB_PATH"
        echo 'LIMO_CAD_AUDITABLE=1' >> "$GITHUB_ENV"
        echo 'LIMO_CAD_AUDITABLE_VERSION=0.7.7' >> "$GITHUB_ENV"
