name: Set up cached Windows OpenCASCADE
description: Share the exact compiler, vcpkg pin, paths and cache keys with the main-branch cache warmer.

inputs:
  triplet:
    description: vcpkg target triplet
    required: true
  runner-cache-key:
    description: Runner image, architecture and ABI cache namespace
    required: true
  msvc-component:
    description: Visual Studio component required by this architecture
    required: true
  vcpkg-commit:
    description: Pinned vcpkg revision
    default: 716b42043743cdceabed9c8e2e6cf80ddae1e0c1

outputs:
  toolset:
    description: MSVC toolset that identifies this SDK build
    value: ${{ steps.msvc.outputs.toolset }}
  root:
    description: Installed OCCT SDK root
    value: ${{ steps.msvc.outputs.root }}

runs:
  using: composite
  steps:
    - name: Check out pinned vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ inputs.vcpkg-commit }}
        path: .vcpkg
        # Versioned port trees need history, not a shallow checkout.
        fetch-depth: 0

    - name: Detect MSVC toolset
      id: msvc
      shell: pwsh
      env:
        MSVC_COMPONENT: ${{ inputs.msvc-component }}
        VCPKG_TRIPLET: ${{ inputs.triplet }}
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationRoot = & $vswhere -latest -products * -requires $env:MSVC_COMPONENT -property installationPath
        if ([string]::IsNullOrWhiteSpace($installationRoot)) { throw "Visual Studio C++ Build Tools were not found" }
        $versionFile = Join-Path $installationRoot 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
        $toolset = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        if ([string]::IsNullOrWhiteSpace($toolset)) { throw "MSVC toolset version is empty" }
        "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $root = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\$env:VCPKG_TRIPLET"
        "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Restore installed OpenCASCADE tree
      id: installed
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}\vcpkg_installed
        key: vcpkg-installed-v1-${{ inputs.runner-cache-key }}-${{ steps.msvc.outputs.toolset }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json') }}

    - name: Restore vcpkg binary cache
      if: steps.installed.outputs.cache-hit != 'true'
      id: binary
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}\.cache\vcpkg\archives
        key: vcpkg-binary-v2-${{ inputs.runner-cache-key }}-${{ steps.msvc.outputs.toolset }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json') }}

    - name: Install pinned OpenCASCADE
      if: steps.installed.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        VCPKG_TRIPLET: ${{ inputs.triplet }}
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.cache\vcpkg\archives,readwrite
      run: |
        New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\.cache\vcpkg\archives" -Force | Out-Null
        & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
        & .\.vcpkg\vcpkg.exe install `
          --triplet $env:VCPKG_TRIPLET `
          --x-manifest-root="$env:GITHUB_WORKSPACE" `
          --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

    # Save before application/tests can fail or time out. Never weaken the
    # compiler/SDK key to reuse an ABI-incompatible cache.
    - name: Save vcpkg binary cache
      if: steps.installed.outputs.cache-hit != 'true' && steps.binary.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}\.cache\vcpkg\archives
        key: vcpkg-binary-v2-${{ inputs.runner-cache-key }}-${{ steps.msvc.outputs.toolset }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json') }}

    - name: Save installed OpenCASCADE tree
      if: steps.installed.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}\vcpkg_installed
        key: vcpkg-installed-v1-${{ inputs.runner-cache-key }}-${{ steps.msvc.outputs.toolset }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json') }}

    - name: Report OpenCASCADE cache source
      shell: pwsh
      env:
        INSTALLED_CACHE_HIT: ${{ steps.installed.outputs.cache-hit }}
      run: |
        $source = if ($env:INSTALLED_CACHE_HIT -eq 'true') { 'installed-tree cache' } else { 'binary cache or cold build; installed-tree cache saved' }
        "OpenCASCADE: **$source**. Cache scope: ``$env:GITHUB_REF``." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
