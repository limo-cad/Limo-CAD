name: Disposable Windows Bevy Japanese IME

# An explicit dispatch owns this disposable desktop. Never runs OS input in
# ordinary PR checks or on a self-hosted/user workstation.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-native-ime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  japanese-ime:
    name: Real Japanese preedit, commit, and cancellation in Bevy
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Provision and prove stock IME feasibility on this same runner
        timeout-minutes: 35
        shell: powershell
        run: |
          & .\xtask\platform\windows-ime-probe.ps1 `
            -Out (Join-Path $env:RUNNER_TEMP 'windows-ime-stock') `
            -ProvisionJapanese -ExerciseIme
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: native-host-windows
      - name: Install native geometry kernel
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: x64-windows
          runner-cache-key: windows-2025-x64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Use the native geometry kernel
        shell: pwsh
        env:
          OCCT_SDK: ${{ steps.occt.outputs.root }}
        run: |
          "OCCT_ROOT=$env:OCCT_SDK" >> $env:GITHUB_ENV
          "$env:OCCT_SDK\bin" >> $env:GITHUB_PATH
      - name: Build the actual feature-enabled native host
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin nbcad
      - name: Exercise the owned Winit field through Windows SendInput
        shell: pwsh
        env:
          NBCAD_NATIVE_IME_TEST: windows-japanese
        run: |
          cargo xtask test-mcp native-platform --desktop-input --ime-japanese `
            --ime-stock-report "$env:RUNNER_TEMP\windows-ime-stock\report.json" `
            --server "$env:GITHUB_WORKSPACE\src-tauri\target\debug\nbcad.exe" `
            --out "$env:RUNNER_TEMP\native-ime-windows"
      - name: Retain stock prerequisites, actual Bevy events, and window captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ime-windows
          path: |
            ${{ runner.temp }}/windows-ime-stock/
            ${{ runner.temp }}/native-ime-windows/
          if-no-files-found: error
          retention-days: 14
