name: Version guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: version-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version_guard:
    name: VERSION matches every carrier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Refuse a release tag that does not name VERSION on main
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: cargo xtask check-release-tag "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Check every version carrier
        run: cargo xtask version --check

      - name: Unit-test the version carriers
        run: cargo test --locked -p xtask 'release_tooling::'
