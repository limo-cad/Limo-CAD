name: Warm Windows SDK caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'native/occt-overlay/**'
      - 'xtask/src/occt_storage.rs'
      - '.gitattributes'
      - '.github/actions/setup-windows-occt/**'
      - '.github/workflows/windows-occt-cache.yml'
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: windows-arm-sdk-cache
  cancel-in-progress: false

jobs:
  warm-x64:
    # Use exactly the namespace consumed by packaging and MCP acceptance.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Warm shared x64 OpenCASCADE SDK
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: x64-windows
          runner-cache-key: windows-2025-x64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64

  warm-arm64:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Warm shared ARM64 OpenCASCADE SDK
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: arm64-windows
          runner-cache-key: windows-11-vs2026-arm-arm64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
