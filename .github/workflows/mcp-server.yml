name: MCP server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'interface/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'crates/assembly/**'
      - 'crates/mcp-mutate/**'
      - 'crates/script/**'
      - 'crates/recipes/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'interface/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'crates/assembly/**'
      - 'crates/mcp-mutate/**'
      - 'crates/script/**'
      - 'crates/recipes/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mcp-tests:
    runs-on: windows-2025
    timeout-minutes: 180
    # Cache versions include path strings: match desktop Windows paths exactly.
    env:
      VCPKG_COMMIT: 716b42043743cdceabed9c8e2e6cf80ddae1e0c1
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives
      VCPKG_INSTALL_ROOT: ${{ github.workspace }}\vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.cache\vcpkg\archives,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          # Shallow clones break versioned port tree objects (opencascade).
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt check failed" }
          cargo fmt --manifest-path mcp-server/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw "mcp-server fmt check failed" }

      - name: MSVC environment
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          $toolset = (Get-Content (Join-Path $installPath "VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt") -Raw).Trim()
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPATH=$env:LIBPATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Reuse the desktop Windows x64 SDK cache with the same compiler and pin.
      - name: Restore installed OpenCASCADE tree
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-v1-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-v2-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_BINARY_CACHE -Force | Out-Null
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }

      - name: Install OCCT via vcpkg
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & .\.vcpkg\vcpkg.exe install `
            --triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      # Save immediately: a cold OCCT build can consume most of the job budget,
      # so waiting for post-job cleanup risks losing the compiled package cache.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true' && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-v2-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Save installed OpenCASCADE tree
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-v1-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: MCP server tests
        shell: pwsh
        env:
          OCCT_ROOT: ${{ github.workspace }}\vcpkg_installed\x64-windows
        run: |
          $env:Path = "$env:OCCT_ROOT\bin;$env:Path"
          cargo test --locked --manifest-path mcp-server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "mcp-server tests failed" }

      - name: Install Node for MCP plans
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: MCP bench and complete feature workshop
        shell: pwsh
        env:
          OCCT_ROOT: ${{ github.workspace }}\vcpkg_installed\x64-windows
        run: |
          $env:Path = "$env:OCCT_ROOT\bin;$env:Path"
          cargo build --locked --manifest-path mcp-server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "MCP binary build failed" }
          cargo xtask test-mcp bench --server ./mcp-server/target/debug/nbcad-mcp.exe --workshop all --out ./target/mcp-workshop
          if ($LASTEXITCODE -ne 0) { throw "MCP workshop failed" }
          cargo xtask test-mcp drawing --server ./mcp-server/target/debug/nbcad-mcp.exe --out ./target/mcp-workshop/drawing-report.json
          if ($LASTEXITCODE -ne 0) { throw "MCP drawing example failed" }
          cargo xtask run-script --recipe garden-bench --repeat 2 --server ./mcp-server/target/debug/nbcad-mcp.exe --out ./target/mcp-workshop/garden-bench
          if ($LASTEXITCODE -ne 0) { throw "Parametric garden bench failed" }
          cargo xtask run-script --recipe fillet-basics --repeat 2 --server ./mcp-server/target/debug/nbcad-mcp.exe --out ./target/mcp-workshop/fillet-basics
          if ($LASTEXITCODE -ne 0) { throw "Parametric fillet lesson failed" }

      - name: Upload MCP workshop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-workshop-windows
          path: target/mcp-workshop/
          if-no-files-found: ignore

      # Keep Windows installer coverage; export tests run in the Linux workspace.
      - name: xtask install-mcp tests
        shell: pwsh
        run: |
          cargo test --locked -p xtask
          if ($LASTEXITCODE -ne 0) { throw "xtask tests failed" }

  # Linux MCP tests use Ubuntu 26.04 apt OCCT 7.9 (same SDK contract as
  # desktop-packages / scripts/docker/ubuntu-26.04.Dockerfile). Host-neutral
  # linux-engine-tests stay on ubuntu-24.04 because they do not link OCCT.
  mcp-tests-linux:
    name: MCP tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCASCADE 7.9 SDK (Ubuntu packages)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libocct-data-exchange-7.9 \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            ninja-build

          # Ubuntu's STEP development package recommends the VTK/IVTK SDK,
          # which noBS CAD does not use. Extract its headers after installing
          # the exact OCCT runtime and lower-level development libraries.
          pushd "$RUNNER_TEMP"
          apt-get download libocct-data-exchange-dev
          package="$(find . -maxdepth 1 -name 'libocct-data-exchange-dev_*.deb' -print -quit)"
          test -n "$package"
          sudo dpkg-deb --extract "$package" /
          popd

      - name: MCP server tests
        shell: bash
        # build.rs probes /usr when OCCT_ROOT is unset; set it explicitly.
        env:
          OCCT_ROOT: /usr
        run: cargo test --locked --manifest-path mcp-server/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: MCP bench and complete feature workshop
        env:
          OCCT_ROOT: /usr
        run: |
          cargo build --locked --manifest-path mcp-server/Cargo.toml
          cargo xtask test-mcp bench --server ./mcp-server/target/debug/nbcad-mcp --workshop all --out ./target/mcp-workshop
          cargo xtask test-mcp drawing --server ./mcp-server/target/debug/nbcad-mcp --out ./target/mcp-workshop/drawing-report.json
          cargo xtask run-script --recipe garden-bench --repeat 2 --server ./mcp-server/target/debug/nbcad-mcp --out ./target/mcp-workshop/garden-bench
          cargo xtask run-script --recipe fillet-basics --repeat 2 --server ./mcp-server/target/debug/nbcad-mcp --out ./target/mcp-workshop/fillet-basics

      - name: Upload MCP workshop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-workshop-linux
          path: target/mcp-workshop/
          if-no-files-found: ignore
