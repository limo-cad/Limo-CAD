name: MCP server

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mcp-server/**'
      - 'knowledge/**'
      - 'interface/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'crates/assembly/**'
      - 'crates/cam/**'
      - 'crates/mcp-mutate/**'
      - 'crates/script/**'
      - 'crates/recipes/**'
      - 'crates/help/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'
      - '.github/workflows/mcp-acceptance.yml'
      - '.gitattributes'
      - '.github/actions/setup-windows-occt/**'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'knowledge/**'
      - 'interface/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'crates/assembly/**'
      - 'crates/cam/**'
      - 'crates/mcp-mutate/**'
      - 'crates/script/**'
      - 'crates/recipes/**'
      - 'crates/help/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'
      - '.github/workflows/mcp-acceptance.yml'
      - '.gitattributes'
      - '.github/actions/setup-windows-occt/**'
      - 'scripts/ci/**'

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-windows-sdk:
    name: Prepare shared Windows SDK
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      sdk-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      sdk-toolset: ${{ steps.occt.outputs.toolset }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          cargo fmt --manifest-path mcp-server/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'mcp-server fmt check failed' }
      - name: Set up cached OpenCASCADE SDK once
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: x64-windows
          runner-cache-key: windows-2025-x64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Share SDK with this run's Windows shards
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-windows-sdk
          path: vcpkg_installed/x64-windows/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mcp-windows:
    needs: prepare-windows-sdk
    uses: ./.github/workflows/mcp-acceptance.yml
    with:
      platform: windows
      sdk-artifact-id: ${{ needs.prepare-windows-sdk.outputs.sdk-artifact-id }}
      sdk-toolset: ${{ needs.prepare-windows-sdk.outputs.sdk-toolset }}

  mcp-linux:
    uses: ./.github/workflows/mcp-acceptance.yml
    with:
      platform: linux

  # Keep the previous top-level check names. These are fail-closed aggregate
  # checks, not successful/skipped placeholders if any shard fails or cancels.
  mcp-tests:
    needs: mcp-windows
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_RESULT: ${{ needs.mcp-windows.result }}
      MCP_PLATFORM: windows
    steps: &publish-demo-projects
      - name: Require every platform acceptance shard
        run: |
          if [[ "$NATIVE_RESULT" != success ]]; then
            echo "Native acceptance did not pass: $MCP_PLATFORM=$NATIVE_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified bench
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-core
          path: target/mcp-recipe-evidence
      - name: Download verified turbine
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-turbine
          path: target/mcp-recipe-evidence
      - name: Download verified vise
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-vise
          path: target/mcp-recipe-evidence
      - name: Stage verified editable demo projects
        run: node scripts/ci/stage-demo-projects.mjs
      - name: Upload verified editable demo projects
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-demo-projects-${{ env.MCP_PLATFORM }}-${{ github.sha }}
          path: target/demo-projects/
          if-no-files-found: error
          overwrite: true

  mcp-tests-linux:
    name: MCP tests (Ubuntu)
    needs: mcp-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_RESULT: ${{ needs.mcp-linux.result }}
      MCP_PLATFORM: linux
    steps: *publish-demo-projects
