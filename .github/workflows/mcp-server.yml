name: MCP server

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mcp-server/**'
      - 'knowledge/**'
      - 'interface/**'
      - 'crates/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'VERSION'
      - 'REPOSITORY'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/actions/setup-rust/**'
      - 'xtask/**'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'native/occt-overlay/**'
      - '.github/actions/setup-unix-occt/**'
      - '.github/workflows/mcp-server.yml'
      - '.github/workflows/mcp-acceptance.yml'
      - '.gitattributes'
      - '.github/actions/setup-windows-occt/**'
      - '.github/actions/setup-linux-desktop/**'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'knowledge/**'
      - 'interface/**'
      - 'crates/**'
      - 'examples/scripts/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'VERSION'
      - 'REPOSITORY'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/actions/setup-rust/**'
      - 'xtask/**'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'native/occt-overlay/**'
      - '.github/actions/setup-unix-occt/**'
      - '.github/workflows/mcp-server.yml'
      - '.github/workflows/mcp-acceptance.yml'
      - '.gitattributes'
      - '.github/actions/setup-windows-occt/**'
      - '.github/actions/setup-linux-desktop/**'
      - 'scripts/ci/**'

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  # Let the current SDK owner finish qualification and save its checked cache.
  # New revisions replace the pending run, then perform their own full checks.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-windows-sdk:
    name: Prepare shared Windows SDK
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      sdk-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      sdk-toolset: ${{ steps.occt.outputs.toolset }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc
      - name: Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt check failed' }
          cargo fmt --manifest-path mcp-server/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'mcp-server fmt check failed' }
      - name: Set up cached OpenCASCADE SDK once
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: x64-windows
          runner-cache-key: windows-2025-x64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Share SDK with this run's Windows shards
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-windows-sdk
          path: vcpkg_installed/x64-windows/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mcp-windows:
    needs: prepare-windows-sdk
    uses: ./.github/workflows/mcp-acceptance.yml
    with:
      platform: windows
      sdk-artifact-id: ${{ needs.prepare-windows-sdk.outputs.sdk-artifact-id }}
      sdk-toolset: ${{ needs.prepare-windows-sdk.outputs.sdk-toolset }}

  mcp-linux:
    uses: ./.github/workflows/mcp-acceptance.yml
    with:
      platform: linux

  mcp-tests:
    needs: mcp-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_RESULT: ${{ needs.mcp-windows.result }}
      MCP_PLATFORM: windows
    steps: &publish-demo-projects
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: demo-publication-registry
          cache-targets: false
      - name: Require every platform acceptance shard
        run: cargo xtask ci require-platform
      - name: Download verified bench
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-core
          path: target/mcp-recipe-evidence
      - name: Download verified turbine
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-turbine
          path: target/mcp-recipe-evidence
      - name: Download verified vise
        uses: actions/download-artifact@v4
        with:
          name: mcp-demo-${{ env.MCP_PLATFORM }}-vise
          path: target/mcp-recipe-evidence
      - name: Stage verified editable demo projects
        run: cargo xtask ci stage-demo-projects
      - name: Upload verified editable demo projects
        uses: actions/upload-artifact@v7
        with:
          name: Limo-CAD-demo-projects-${{ env.MCP_PLATFORM }}-${{ github.sha }}
          path: target/demo-projects/
          if-no-files-found: error
          overwrite: true

  mcp-tests-linux:
    name: MCP tests (Ubuntu)
    needs: mcp-linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_RESULT: ${{ needs.mcp-linux.result }}
      MCP_PLATFORM: linux
    steps: *publish-demo-projects
