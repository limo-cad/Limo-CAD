name: Frontend

on:
  push:
    branches: [main]
  # Desktop packages calls this once for every PR, including stacked bases,
  # plus tags and manual builds. Keep push-to-main validation independent.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sketch-interactions:
    name: Sketch browser smoke regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: sketch-wasm
      - name: Install pinned WASM packager
        # rust-cache already restores ~/.cargo/bin. Cargo install otherwise
        # rebuilds the tool when its installation metadata is absent.
        run: |
          if ! command -v wasm-pack >/dev/null || [ "$(wasm-pack --version)" != 'wasm-pack 0.13.1' ]; then
            cargo install wasm-pack --version 0.13.1 --locked --force
          fi
          test "$(wasm-pack --version)" = 'wasm-pack 0.13.1'
      - name: Build current browser engine
        run: npm run build:wasm
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preview, commit, cancellation and history smoke tests
        run: npm run e2e:sketch-smoke
      - name: Broader sketch interaction regressions on main or manual runs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run e2e:sketch-regression
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sketch-browser-failure
          path: docs/qa/
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests:
    name: Frontend regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run all frontend regression suites
        run: npm run test:frontend
      - name: Test guarded application exit and control acknowledgements
        run: npx tsx scripts/applicationExit.test.ts
      - name: Verify desktop frontend builds without browser WASM
        run: npm run build:desktop
      - name: Test live MCP snapshot revision boundaries
        run: npx tsx scripts/sessionSnapshot.test.ts
      - name: Install Chromium for UI contract checks
        run: npx playwright install --with-deps chromium
      - name: Install Rust for xtask
        uses: dtolnay/rust-toolchain@stable
      - name: Test live UI control contracts and product command coverage
        run: cargo xtask test-mcp contracts
      - name: Test associative drawing dimension references
        run: npx tsx scripts/drawingDimensions.test.ts
