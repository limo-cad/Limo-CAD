name: Native sketch visual regressions

on:
  pull_request:
    paths:
      - 'desktop/src/native_viewport/**'
      - 'desktop/src/session_bridge/native_interface/controller/files/scripts/preview/**'
      - 'desktop/src/session_bridge/native_interface/controller/files/scripts/preview.rs'
      - 'desktop/src/session_bridge/native_interface/controller/chrome.rs'
      - 'desktop/src/session_bridge/native_interface/controller/files.rs'
      - 'desktop/src/session_bridge/native_interface/controller/files/panel.rs'
      - 'desktop/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'desktop/assets/show-me/**'
      - 'mcp-server/examples/generate_show_me.rs'
      - 'crates/core/**'
      - 'crates/solid/**'
      - 'crates/sketch/**'
      - 'crates/occt/**'
      - 'crates/native-engine/**'
      - 'crates/recipes/**'
      - 'crates/help/**'
      - 'crates/script/**'
      - 'mcp-server/src/**'
      - 'mcp-server/Cargo.toml'
      - 'examples/scripts/extrude-basics.limo.jsonc'
      - 'examples/scripts/show-me-*.limo.jsonc'
      - 'examples/scripts/show-me-sketch.lessons.json'
      - 'knowledge/concepts/show-me-*.md'
      - 'interface/demonstrations.json'
      - 'interface/catalog.json'
      - 'assets/i18n/**'
      - 'knowledge/concepts/extrude-basics.md'
      - 'knowledge/concepts/bracket-sketch.md'
      - 'knowledge/concepts/bracket-cut.md'
      - 'xtask/src/repository_ci.rs'
      - 'xtask/src/workflow_contracts.rs'
      - '.github/workflows/native-visual.yml'
      - '.github/actions/setup-rust/**'
      - '.github/actions/setup-unix-occt/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-visual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-platform-input:
    # A manual full qualification retains all real OS-input families. Renderer
    # PR changes run the GPU matrix without rebuilding those unrelated fixtures.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-host-tests.yml
    with:
      desktop-input: true

  native-visual:
    runs-on: macos-14
    # Cold SDK setup and compilation precede the complete guide catalog.
    # Keep every fixture deadline and bound the full qualification job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> target
          key: native-visual
      - name: Install native geometry kernel
        uses: ./.github/actions/setup-unix-occt
      - name: Generate Show me snapshots with the checked out engine
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
        run: |
          # Cargo examples do not inherit the desktop binary's SDK rpath.
          DYLD_LIBRARY_PATH="$OCCT_ROOT/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            cargo run --locked --manifest-path mcp-server/Cargo.toml --example generate_show_me -- --out desktop/assets/show-me
          mkdir -p docs/qa/native-boundary/show-me-generated
          cp desktop/assets/show-me/*.cbor desktop/assets/show-me/provenance.json docs/qa/native-boundary/show-me-generated/
      - name: Verify projected boundaries and thin-wall occlusion on the GPU
        env:
          LIMO_CAD_PREVIEW_PROOF_DIR: ${{ github.workspace }}/docs/qa/native-boundary
        run: cargo xtask ci native-ignored-test sketch-visual
      - name: Verify grid visibility restores without pointer input
        run: cargo xtask ci native-ignored-test grid-redraw
      - name: Verify bundled lesson source freshness and geometry budgets
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --lib native_script_preview_bundled_assets
          cargo test --locked --manifest-path desktop/Cargo.toml --lib chamfer_form
          cargo test --locked --manifest-path desktop/Cargo.toml --lib preview::transition_tests:: -- --test-threads=1
          cargo test --locked --manifest-path desktop/Cargo.toml --lib preview::navigation_tests:: -- --test-threads=1
          cargo test --locked --manifest-path desktop/Cargo.toml --lib preview::evidence::ink:: -- --test-threads=1
          cargo test --locked --manifest-path desktop/Cargo.toml --lib native_script_preview_book_focus_waits_only_for_its_dismissed_menu -- --test-threads=1
          cargo test --locked --manifest-path desktop/Cargo.toml --lib native_script_preview_tabs_after_extrude_in_the_production_ribbon -- --test-threads=1
      - name: Verify the Extrude lesson profile and solid on the GPU
        env:
          LIMO_CAD_PREVIEW_PROOF_DIR: ${{ github.workspace }}/docs/qa/native-boundary
          LIMO_CAD_SHOW_ME_PROOF_DIR: ${{ github.workspace }}/docs/qa/native-boundary/show-me
          LIMO_CAD_BUILD_REVISION: ${{ github.sha }}
          RUST_TEST_THREADS: 1
        run: |
          cargo xtask ci native-ignored-test extrude-preview
          cargo xtask ci native-ignored-test show-me-ui
          cargo xtask ci native-ignored-test show-me-lifecycle
      - name: Verify committed sketch geometry appears without pointer input
        env:
          LIMO_VIEWPORT_RENDER_PROOFS: ${{ github.workspace }}/docs/qa/native-boundary
        run: cargo xtask ci native-ignored-test sketch-commit
      - name: Verify CAD pixels survive the later native interface camera
        env:
          LIMO_VIEWPORT_RENDER_PROOFS: ${{ github.workspace }}/docs/qa/native-boundary
        run: cargo xtask ci native-ignored-test composition
      - name: Retain native visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-sketch-visuals
          path: docs/qa/native-boundary/
          if-no-files-found: error
          retention-days: 14
