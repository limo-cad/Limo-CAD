name: pages-knowledge
on:
  pull_request:
    branches: [main]
    paths:
      - "knowledge/**"
      - "docs/knowledge-wiki.md"
      - "xtask/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "REPOSITORY"
      - ".cargo/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/pages-knowledge.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "docs/knowledge-wiki.md"
      - "xtask/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "REPOSITORY"
      - ".cargo/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/pages-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: knowledge-tools
      - name: Test showcase media validation (offline)
        run: cargo test --locked -p xtask 'showcase_media::'
      - name: Validate OKF bundle
        run: |
          cargo test --locked -p xtask knowledge::
          cargo xtask knowledge check
      - name: Verify the committed help search index is fresh
        run: |
          cargo xtask knowledge index --check
      - name: Verify the pinned showcase release is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask knowledge media --verify
      - name: Build static knowledge site
        run: cargo xtask knowledge site
      - name: Stage verified public showcase videos
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask knowledge media
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
