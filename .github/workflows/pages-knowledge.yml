name: pages-knowledge
on:
  pull_request:
    branches: [main]
    paths:
      - "knowledge/**"
      - "docs/knowledge-wiki.md"
      - "xtask/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "REPOSITORY"
      - ".cargo/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/pages-knowledge.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "docs/knowledge-wiki.md"
      - "xtask/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "REPOSITORY"
      - ".cargo/**"
      - ".github/actions/setup-rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/pages-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: knowledge-tools
      - name: Test showcase media validation (offline)
        run: cargo test --locked -p xtask 'showcase_media::'
      - name: Validate OKF bundle
        run: |
          cargo test --locked -p xtask knowledge::
          cargo xtask knowledge check
      - name: Verify the committed help search index is fresh
        run: |
          cargo xtask knowledge index --check
      - name: Verify the pinned showcase release is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask knowledge media --verify
      - name: Build static knowledge site
        run: cargo xtask knowledge site
      - name: Stage verified public showcase videos
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask knowledge media
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
