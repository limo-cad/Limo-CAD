name: Rust interface contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface-contracts:
    name: Frontend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: interface-contracts
      - name: Check shared control identity, focus and ownership
        run: cargo test --locked -p limo-cad-interface
      - name: Compile the browser engine boundary
        run: cargo check --locked -p limo-cad-wasm --target wasm32-unknown-unknown
