name: Native MCP acceptance

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      sdk-artifact-id:
        type: string
        default: ''
      sdk-toolset:
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  acceptance:
    name: MCP acceptance (${{ inputs.platform }} / ${{ matrix.shard }})
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.platform == 'windows' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            project: garden-bench
          - shard: turbine
            project: vertical-axis-turbine
          - shard: vise
            project: d-screw-vise
    env:
      OCCT_ROOT: ${{ inputs.platform == 'windows' && format('{0}/vcpkg_installed/x64-windows', github.workspace) || '/usr' }}
      LIMO_CAD_RECIPE_ARTIFACT_DIR: ${{ github.workspace }}/target/mcp-recipe-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.shard == 'core' && '0' || '1' }}
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ inputs.platform == 'windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Validate platform inputs
        shell: pwsh
        env:
          MCP_PLATFORM: ${{ inputs.platform }}
          SDK_ARTIFACT_ID: ${{ inputs.sdk-artifact-id }}
          SDK_TOOLSET: ${{ inputs.sdk-toolset }}
        run: |
          if ($env:MCP_PLATFORM -notin @('windows', 'linux')) { throw 'Unknown native acceptance platform' }
          if ($env:MCP_PLATFORM -eq 'windows' -and
              ([string]::IsNullOrWhiteSpace($env:SDK_ARTIFACT_ID) -or [string]::IsNullOrWhiteSpace($env:SDK_TOOLSET))) {
            throw 'Windows acceptance requires the SDK produced by this workflow run'
          }

      - name: Download this run's Windows SDK
        if: inputs.platform == 'windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.sdk-artifact-id }}
          path: vcpkg_installed/x64-windows
          merge-multiple: true

      - name: MSVC environment and SDK compatibility
        if: inputs.platform == 'windows'
        shell: pwsh
        env:
          SDK_TOOLSET: ${{ inputs.sdk-toolset }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          $toolset = (Get-Content (Join-Path $installPath 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if ($toolset -ne $env:SDK_TOOLSET) { throw "SDK/compiler mismatch: SDK $env:SDK_TOOLSET, runner $toolset" }
          if (-not (Test-Path -LiteralPath "$env:OCCT_ROOT/include/opencascade/Standard.hxx")) { throw 'SDK headers are missing' }
          $env:Path = "$env:OCCT_ROOT/bin;$env:Path"
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Qualify downloaded Windows SDK
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          cargo xtask verify-occt-storage --prefix $env:OCCT_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded SDK runtime qualification failed' }

      - name: Install checked OpenCASCADE 7.9 SDK
        if: inputs.platform == 'linux'
        uses: ./.github/actions/setup-unix-occt

      - name: Install recipe evidence fonts
        if: inputs.platform == 'linux'
        run: sudo apt-get install --yes --no-install-recommends clang fonts-noto-core fonts-noto-cjk

      - name: Lint native Rust workspaces
        id: native-lint
        if: matrix.shard == 'core'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mcp-server/target
        run: |
          cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native workspace lint failed' }
          cargo clippy --locked --manifest-path mcp-server/Cargo.toml --all-targets --all-features --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'MCP lint failed' }

      - name: MCP server tests
        id: native-tests
        shell: pwsh
        run: |
          cargo xtask ci mcp-shard ${{ matrix.shard }}
          if ($LASTEXITCODE -ne 0) { throw 'MCP server tests failed' }

      - name: Native geometry integration regressions
        if: ${{ !cancelled() && matrix.shard == 'core' && steps.native-lint.outcome == 'success' }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mcp-server/target
        run: |
          cargo test --locked -p limo-cad-occt --features native-occt --tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'native integration tests failed' }

      - name: Collect bounded native recipe failure evidence
        if: failure() && steps.native-tests.outcome == 'failure'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'target/mcp-recipe-evidence'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'target/mcp-recipe-failure'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $files = @(if (Test-Path -LiteralPath $source) {
            Get-ChildItem -LiteralPath $source -File |
              Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
              Sort-Object @{Expression = { $_.Name -notlike 'last-request-*' }}, @{Expression = 'LastWriteTimeUtc'; Descending = $true}
          })
          $total = 0L
          $index = @($files | Select-Object -First 512 | ForEach-Object {
            $reason = 'copied'
            if ($_.Length -gt 64MB) { $reason = 'exceeds 64 MiB per-file limit' }
            elseif ($total + $_.Length -gt 128MB) { $reason = 'exceeds 128 MiB total limit' }
            else {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $destination $_.Name)
              $total += $_.Length
            }
            @{ name = $_.Name; bytes = $_.Length; result = $reason }
          })
          @{ discovered_files = $files.Count; considered_files = $index.Count; copied_bytes = $total; files = $index } |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $destination 'artifact-index.json') -Encoding utf8

      - name: Upload native recipe failure evidence
        if: failure() && steps.native-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-recipe-failure-${{ inputs.platform }}-${{ matrix.shard }}
          path: target/mcp-recipe-failure/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: MCP bench and complete feature workshop
        if: matrix.shard == 'core'
        shell: pwsh
        run: |
          cargo build --locked --manifest-path mcp-server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'MCP binary build failed' }
          $server = if ($IsWindows) { './mcp-server/target/debug/limo-cad-mcp.exe' } else { './mcp-server/target/debug/limo-cad-mcp' }
          cargo xtask test-mcp bench --server $server --workshop all --out ./target/mcp-workshop
          if ($LASTEXITCODE -ne 0) { throw 'MCP workshop failed' }
          cargo xtask test-mcp drawing --server $server --out ./target/mcp-workshop/drawing-report.json
          if ($LASTEXITCODE -ne 0) { throw 'MCP drawing example failed' }
          cargo xtask run-script --recipe garden-bench --repeat 2 --server $server --out ./target/mcp-workshop/garden-bench --save ./target/mcp-recipe-evidence/garden-bench.limo
          if ($LASTEXITCODE -ne 0) { throw 'Parametric garden bench failed' }
          cargo xtask run-script --recipe fillet-basics --repeat 2 --server $server --out ./target/mcp-workshop/fillet-basics
          if ($LASTEXITCODE -ne 0) { throw 'Parametric fillet lesson failed' }

      - name: xtask install-mcp tests
        if: inputs.platform == 'windows' && matrix.shard == 'core'
        shell: pwsh
        run: |
          cargo test --locked -p xtask
          if ($LASTEXITCODE -ne 0) { throw 'xtask tests failed' }

      - name: Upload successful demo input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-demo-${{ inputs.platform }}-${{ matrix.shard }}
          path: target/mcp-recipe-evidence/${{ matrix.project }}.limo
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload MCP workshop evidence
        if: always() && matrix.shard == 'core'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-workshop-${{ inputs.platform }}
          path: target/mcp-workshop/
          if-no-files-found: ignore
          overwrite: true
