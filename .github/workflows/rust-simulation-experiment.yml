name: Rust simulation experiment

on:
  pull_request:
    paths:
      - 'experiments/rust-simulation/**'
      - '.github/workflows/rust-simulation-experiment.yml'
      - '.github/actions/setup-rust/**'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Rust structural qualification and world diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install mesh I/O prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends liblzma-dev pkg-config
      - name: Check formatting
        run: cargo fmt --manifest-path experiments/rust-simulation/Cargo.toml --check
      - name: Check Rust lints
        run: cargo clippy --locked --manifest-path experiments/rust-simulation/Cargo.toml --all-targets -- -D warnings
      - name: Create runner result directory
        env:
          LIMO_SIM_RESULTS: ${{ runner.temp }}/limo-simulation-results
        run: |
          mkdir -p "$LIMO_SIM_RESULTS"
          echo "LIMO_SIM_RESULTS=$LIMO_SIM_RESULTS" >> "$GITHUB_ENV"
      - name: Qualify static elasticity
        run: cargo run --locked --manifest-path experiments/rust-simulation/Cargo.toml --bin structural -- "$LIMO_SIM_RESULTS/structural-results.json"
      - name: Record world and FEM diagnostics
        run: cargo run --locked --manifest-path experiments/rust-simulation/Cargo.toml --bin world -- "$LIMO_SIM_RESULTS/world-results.json"
      - name: Compare identical Tet4 mesh against this runner's settled world result
        run: cargo run --locked --manifest-path experiments/rust-simulation/Cargo.toml --bin same_mesh -- "$LIMO_SIM_RESULTS/same-mesh-results.json" "$LIMO_SIM_RESULTS/world-results.json"
      - name: Retain actual runner results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-simulation-results
          path: ${{ runner.temp }}/limo-simulation-results/*.json
          if-no-files-found: warn
