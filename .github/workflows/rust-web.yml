name: Rust web engine and repository tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-engine:
    name: Rust WASM engine facade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: rust-wasm-engine
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
      - name: Install pinned WASM packager
        run: cargo xtask bootstrap --wasm
      - name: Lint WASM engine targets
        run: cargo clippy --locked -p limo-cad-wasm --target wasm32-unknown-unknown --all-targets --no-deps -- -D warnings
      - name: Build Rust engine bindings
        run: cargo xtask build-wasm
      - name: Exercise the exported facade in Chrome
        run: cargo xtask smoke-wasm

  repository-tooling:
    name: Repository Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: repository-tools
      - name: Check formatting in every Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo fmt --manifest-path mcp-server/Cargo.toml --all -- --check
      - name: Lint all host-neutral targets
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - name: Fetch and verify embedded material catalog
        run: cargo xtask materials --fetch --check
      - name: Fetch and verify embedded printer profiles
        run: cargo xtask printer-profiles --fetch --check
      - run: cargo test --locked -p xtask 'repository_ci::'
      - run: cargo test --locked -p xtask 'workflow_contracts::'
      - run: cargo test --locked -p limo-cad-interface
      - run: cargo xtask audit-icons
      - run: cargo xtask version --check
