name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      macos_signing:
        description: macOS signing mode
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - production
  pull_request:
  push:
    tags:
      - "v*"

env:
  LIMO_CAD_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  # Keep release/manual receipts; cancel obsolete PR builds before they occupy runners.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version_preflight:
    uses: ./.github/workflows/version-guard.yml

  classify_changes:
    name: Classify desktop build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows_should_build: ${{ steps.classify.outputs.windows_should_build }}
      macos_should_build: ${{ steps.classify.outputs.macos_should_build }}
      linux_should_build: ${{ steps.classify.outputs.linux_should_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: desktop-input-classifier
      - name: Inspect changed paths
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask ci desktop-changes

  build-windows-portable:
    name: Windows ${{ matrix.architecture }} portable ZIP
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.windows_should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            runner_cache_key: windows-2025-x64-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - architecture: arm64
            runner: windows-11-vs2026-arm
            runner_cache_key: windows-11-vs2026-arm-arm64-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}

    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.rust_target }}

      - name: Set up cached OpenCASCADE SDK
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: ${{ matrix.vcpkg_triplet }}
          runner-cache-key: ${{ matrix.runner_cache_key }}
          msvc-component: ${{ matrix.msvc_component }}

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify embedded material catalog
        run: cargo xtask materials --fetch --check
      - name: Fetch and verify embedded printer profiles
        run: cargo xtask printer-profiles --fetch --check

      - name: Build portable ZIP
        shell: pwsh
        env:
          OCCT_ROOT: ${{ steps.occt.outputs.root }}
        run: |
          $dirty = git status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect package source identity' }
          if (-not [string]::IsNullOrWhiteSpace(($dirty -join "`n"))) {
            throw "Packaging requires clean build inputs: $dirty"
          }
          cargo xtask package --target "${{ matrix.rust_target }}"
          if ($LASTEXITCODE -ne 0) { throw "Native portable build failed" }

      - name: Verify packaged MCP without an OCCT SDK
        shell: pwsh
        run: |
          $archive = Get-ChildItem "desktop\target\${{ matrix.rust_target }}\release\bundle\portable" -Filter "*.zip" -File
          if (@($archive).Count -ne 1) { throw "Expected one portable ZIP" }
          $verifyRoot = Join-Path $env:RUNNER_TEMP "limo-cad-mcp-package-${{ matrix.architecture }}"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $verifyRoot
          $executable = Get-ChildItem -LiteralPath $verifyRoot -Filter "Limo-CAD.exe" -File -Recurse
          if (@($executable).Count -ne 1) { throw "Expected one packaged executable" }
          $uriKey = 'HKEY_CURRENT_USER\Software\Classes\limo-cad\shell\open\command'
          $uriBefore = [Microsoft.Win32.Registry]::GetValue($uriKey, '', $null)
          cargo xtask verify-package-mcp --server $executable.FullName --server-arg --headless --out "$env:RUNNER_TEMP\limo-cad-viewport-diagnostics\${{ matrix.architecture }}\mcp.json"
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP verification failed" }
          if ([Microsoft.Win32.Registry]::GetValue($uriKey, '', $null) -cne $uriBefore) {
            throw "Headless MCP changed the desktop URI handler"
          }

      - name: Verify default packaged desktop stdio
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "limo-cad-mcp-package-${{ matrix.architecture }}"
          $executable = Get-ChildItem -LiteralPath $verifyRoot -Filter 'Limo-CAD.exe' -File -Recurse
          if (@($executable).Count -ne 1) { throw "Expected one extracted packaged executable" }
          cargo xtask verify-package-mcp --server $executable.FullName --server-arg --headless --desktop --out "$env:RUNNER_TEMP\limo-cad-viewport-diagnostics\${{ matrix.architecture }}\desktop-stdio.json"
          if ($LASTEXITCODE -ne 0) { throw "Default desktop stdio verification failed" }

      - name: Qualify control-enabled source host with isolated packaged runtime
        shell: pwsh
        env:
          OCCT_ROOT: ${{ steps.occt.outputs.root }}
          VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
          LIMO_CAD_BUILD_REVISION: ${{ github.sha }}
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "limo-cad-mcp-package-${{ matrix.architecture }}"
          $executable = Get-ChildItem -LiteralPath $verifyRoot -Filter 'Limo-CAD.exe' -File -Recurse
          if (@($executable).Count -ne 1) { throw "Expected one extracted packaged executable" }
          $packageHash = (Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256).Hash
          $archive = Get-ChildItem 'desktop/target/${{ matrix.rust_target }}/release/bundle/portable' -Filter '*.zip' -File
          if (@($archive).Count -ne 1) { throw "Expected one default portable ZIP" }
          $archiveHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          # Reuse compilation cache; the archived and extracted default payloads are already frozen.
          $probeTarget = Join-Path $env:GITHUB_WORKSPACE 'desktop/target'
          cargo build --locked --release --manifest-path desktop/Cargo.toml --bin limo-cad --features native-computer-control --target "${{ matrix.rust_target }}" --target-dir $probeTarget
          if ($LASTEXITCODE -ne 0) { throw "Control-enabled source host build failed" }
          $probeRoot = Join-Path $env:RUNNER_TEMP "limo-cad-control-source-host-${{ matrix.architecture }}"
          if (Test-Path -LiteralPath $probeRoot) { throw "Source host qualification directory already exists" }
          Copy-Item -LiteralPath $executable.DirectoryName -Destination $probeRoot -Recurse
          $probeExecutable = Join-Path $probeRoot 'Limo-CAD.exe'
          Copy-Item -LiteralPath (Join-Path $probeTarget '${{ matrix.rust_target }}/release/limo-cad.exe') -Destination $probeExecutable -Force
          $diagnostics = Join-Path $env:RUNNER_TEMP 'limo-cad-viewport-diagnostics/${{ matrix.architecture }}/controlled-source-host'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          @{scope='control-enabled source host; default artifact OS input is not qualified';revision=$env:LIMO_CAD_BUILD_REVISION;feature='native-computer-control';default_archive_sha256=$archiveHash;default_package_sha256=$packageHash;source_host_sha256=(Get-FileHash -LiteralPath $probeExecutable -Algorithm SHA256).Hash} | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $diagnostics 'host-identity.json')
          & .\scripts\verify-windows-viewport.ps1 `
            -PackageDirectory $probeRoot `
            -DiagnosticsDirectory $diagnostics `
            -ControlledSourceHost
          if ((Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256).Hash -cne $packageHash) {
            throw "Source host qualification changed the default packaged executable"
          }
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash -cne $archiveHash) {
            throw "Source host qualification changed the default portable ZIP"
          }
          $uriBase = 'HKEY_CURRENT_USER\Software\Classes\limo-cad'
          $handler = [Microsoft.Win32.Registry]::GetValue("$uriBase\shell\open\command", '', $null)
          $expected = '"' + $executable.FullName + '" "%1"'
          if (-not [string]::Equals($handler, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Recipe URI handler does not point to the default packaged executable: $handler"
          }
          if ($null -eq [Microsoft.Win32.Registry]::GetValue($uriBase, 'URL Protocol', $null)) {
            throw "Recipe URI protocol marker is missing"
          }
          @{scheme='limo-cad';command=$handler;status='registered';scope='default package registration retained; URI delivery not exercised'} | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $diagnostics 'recipe-uri.json')

      - name: Upload Windows viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-windows-${{ matrix.architecture }}-viewport-diagnostics
          path: ${{ runner.temp }}\limo-cad-viewport-diagnostics\${{ matrix.architecture }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-${{ steps.app_version.outputs.version }}-windows-${{ matrix.architecture }}
          path: |
            desktop/target/${{ matrix.rust_target }}/release/bundle/portable/*.zip
            desktop/target/${{ matrix.rust_target }}/release/bundle/portable/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-ubuntu:
    name: Ubuntu 26.04 x64 DEB
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}

    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install Ubuntu desktop SDK
        uses: ./.github/actions/setup-linux-desktop
        with:
          desktop-input: 'true'

      - name: Install checked OCCT SDK
        uses: ./.github/actions/setup-unix-occt

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: linux-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'desktop/Cargo.lock', 'desktop/Cargo.toml', 'crates/**/Cargo.toml', 'vcpkg.json') }}
          restore-keys: |
            linux-ubuntu-26.04-${{ runner.arch }}-

      - name: Fetch and verify embedded material catalog
        run: cargo xtask materials --fetch --check
      - name: Fetch and verify embedded printer profiles
        run: cargo xtask printer-profiles --fetch --check

      - name: Build and audit Linux packages
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$(realpath -m desktop/target/release/bundle)"
          test "$bundle_root" = "$GITHUB_WORKSPACE/desktop/target/release/bundle"
          rm -rf -- "$bundle_root/deb" "$bundle_root/appimage"
          cargo xtask package --bundle deb
          test "$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Verify DEB MCP without a display
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find desktop/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          mcp_root="$RUNNER_TEMP/limo-cad-mcp-deb"
          mkdir -p "$mcp_root"
          dpkg-deb -x "$deb" "$mcp_root"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$mcp_root/usr/bin/limo-cad" --server-arg --headless \
            --out "$RUNNER_TEMP/limo-cad-linux-viewport-diagnostics/mcp-deb.json"

      - name: Verify packaged native interface on X11 and Wayland
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find desktop/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "$deb" ]]; then
            echo "Debian package was not created" >&2
            exit 1
          fi
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$deb" \
            x11 \
            "$RUNNER_TEMP/limo-cad-linux-viewport-diagnostics/x11"
          scripts/verify-linux-viewport.sh \
            "$deb" \
            wayland \
            "$RUNNER_TEMP/limo-cad-linux-viewport-diagnostics/wayland"
          vulkan_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- \
            env WGPU_BACKEND=vulkan VK_ICD_FILENAMES="$vulkan_icd" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo xtask verify-package-mcp \
              --server "$RUNNER_TEMP/limo-cad-mcp-deb/usr/bin/limo-cad" --server-arg --headless --desktop \
              --out "$RUNNER_TEMP/limo-cad-linux-viewport-diagnostics/desktop-stdio.json"

      - name: Upload Linux viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-linux-viewport-diagnostics
          path: ${{ runner.temp }}/limo-cad-linux-viewport-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ubuntu release
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-${{ steps.app_version.outputs.version }}-ubuntu-26.04-x64
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/deb/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-appimage:
    name: Linux x64 AppImage (Ubuntu 22.04 build)
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}
      DEBIAN_FRONTEND: noninteractive
      OCCT_ROOT: /opt/opencascade
      LD_LIBRARY_PATH: /opt/opencascade/lib

    steps:
      - name: Install Ubuntu 22.04 build SDK
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            dbus-x11 \
            desktop-file-utils \
            file \
            git \
            libdbus-1-3 \
            libfontconfig-dev \
            libfreetype-dev \
            libfuse2 \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb1 \
            libxcursor1 \
            libxi6 \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            mesa-vulkan-drivers \
            ninja-build \
            patchelf \
            squashfs-tools \
            vulkan-tools \
            xauth \
            xclip \
            xdg-utils \
            xdotool \
            xvfb \
            xz-utils \
            zenity \
            zstd

      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            desktop/target
          key: linux-appimage-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'xtask/Cargo.toml', 'desktop/Cargo.lock', 'desktop/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            linux-appimage-ubuntu-22.04-${{ runner.arch }}-

      - name: Fingerprint the OCCT compiler and FreeType SDK
        id: occt_key
        shell: bash
        run: cargo xtask build-occt --prefix /opt/opencascade --github-key

      - name: Restore compatible OCCT SDK and build objects
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/opencascade
            ${{ runner.temp }}/limo-cad-occt-cache
          key: occt-ubuntu-22.04-v2-${{ runner.arch }}-${{ steps.occt_key.outputs.sdk_key }}

      - name: Build or verify OCCT 7.9 from pinned source
        id: occt_build
        env:
          LIMO_CAD_BUILD_CACHE: ${{ runner.temp }}/limo-cad-occt-cache
        shell: bash
        run: cargo xtask build-occt --prefix /opt/opencascade

      - name: Save verified OCCT before application checks
        if: steps.occt.outputs.cache-hit != 'true' && steps.occt_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/opencascade
            ${{ runner.temp }}/limo-cad-occt-cache
          key: ${{ steps.occt.outputs.cache-primary-key }}

      - name: Fetch and verify embedded material catalog
        run: cargo xtask materials --fetch --check
      - name: Fetch and verify embedded printer profiles
        run: cargo xtask printer-profiles --fetch --check

      - name: Build and audit the AppImage
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$(realpath -m desktop/target/release/bundle)"
          test "$bundle_root" = "$GITHUB_WORKSPACE/desktop/target/release/bundle"
          rm -rf -- "$bundle_root/deb" "$bundle_root/appimage"
          cargo xtask package --bundle appimage
          test "$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1

      - name: Refuse an AppImage that needs a newer glibc than Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          work="$(mktemp -d)"
          ( cd "$work" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null )
          required="$(find "$work/squashfs-root" -type f -print0 \
            | xargs -0 file --no-pad --separator '|' | grep '|.*ELF' | cut -d'|' -f1 \
            | xargs -d '\n' sh -c 'for elf; do objdump -T "$elf" 2>/dev/null || true; done' _ \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -n 1)"
          rm -rf "$work"
          echo "Newest glibc symbol version required: $required"
          test -n "$required"
          test "$(printf '%s\n' "$required" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35

      - name: Verify AppImage MCP without a display
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$appimage" --server-arg --appimage-extract-and-run --server-arg --headless \
            --out "$RUNNER_TEMP/limo-cad-linux-appimage-diagnostics/mcp-appimage.json"

      - name: Verify packaged native viewport on X11
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$appimage" \
            x11 \
            "$RUNNER_TEMP/limo-cad-linux-appimage-diagnostics/x11"

      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-linux-appimage-diagnostics
          path: ${{ runner.temp }}/limo-cad-linux-appimage-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AppImage release
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-${{ steps.app_version.outputs.version }}-linux-x64-appimage
          path: |
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/appimage/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-linux-appimage:
    name: Linux x64 AppImage on Ubuntu 26.04
    needs: [classify_changes, build-linux-appimage]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install Ubuntu 26.04 headless desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            dbus-x11 \
            desktop-file-utils \
            libegl1 \
            libdbus-1-3 \
            libx11-6 \
            libx11-xcb1 \
            libxcursor1 \
            libxi6 \
            libxkbcommon-x11-0 \
            libvulkan1 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            mesa-vulkan-drivers \
            xauth \
            xclip \
            xdg-utils \
            xdotool \
            xvfb \
            zenity

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: Limo-CAD-${{ steps.app_version.outputs.version }}-linux-x64-appimage
          path: ${{ runner.temp }}/appimage

      - name: Verify AppImage MCP and native viewport on X11
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$RUNNER_TEMP/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          ( cd "$RUNNER_TEMP/appimage" && sha256sum -c ./*.AppImage.sha256 )
          chmod +x "$appimage"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$appimage" --server-arg --appimage-extract-and-run --server-arg --headless \
            --out "$RUNNER_TEMP/limo-cad-linux-appimage-26.04-diagnostics/mcp-appimage.json"
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$appimage" \
            x11 \
            "$RUNNER_TEMP/limo-cad-linux-appimage-26.04-diagnostics/x11"

      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-linux-appimage-26.04-diagnostics
          path: ${{ runner.temp }}/limo-cad-linux-appimage-26.04-diagnostics
          if-no-files-found: warn
          retention-days: 7

  build-macos-apple-silicon:
    name: macOS Apple silicon DMG
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.macos_should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOS_DISTRIBUTION_BUILD: >-
        ${{ github.ref_type == 'tag' ||
            (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production') }}
      CARGO_PROFILE_RELEASE_STRIP: >-
        ${{ (github.ref_type == 'tag' ||
             (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production')) &&
            'symbols' || 'none' }}

    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Verify Apple silicon runner
        shell: bash
        run: |
          architecture="$(uname -m)"
          if [[ "$architecture" != "arm64" ]]; then
            echo "Expected an Apple silicon runner, got $architecture" >&2
            exit 1
          fi

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          target: aarch64-apple-darwin

      - name: Install checked OpenCASCADE 7.9.3
        uses: ./.github/actions/setup-unix-occt

      - name: Import Developer ID Application certificate
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE repository secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD repository secret}"

          certificate_path="$RUNNER_TEMP/limo-cad-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/limo-cad-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" |
            openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(Developer ID Application: .+)"$/\1/p' |
              sed -n '1p'
          )"
          if [[ -z "$signing_identity" ]]; then
            security find-identity -v -p codesigning "$keychain_path"
            echo "The imported archive does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "Imported production signing identity: $signing_identity"

      - name: Prepare App Store Connect notarization key
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER repository secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY repository secret}"
          : "${APPLE_API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY repository secret}"

          api_key_path="$RUNNER_TEMP/limo-cad-notary-api-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"; then
            echo "APPLE_API_PRIVATE_KEY is not an App Store Connect .p8 private key." >&2
            exit 1
          fi

      - name: Fetch and verify embedded material catalog
        run: cargo xtask materials --fetch --check
      - name: Fetch and verify embedded printer profiles
        run: cargo xtask printer-profiles --fetch --check

      - name: Build ad-hoc signed DMG
        if: env.MACOS_DISTRIBUTION_BUILD != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo xtask package

      - name: Build Developer ID signed and notarized DMG
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/limo-cad-notary-api-key.p8
        run: cargo xtask package

      - name: Verify Developer ID signature and notarization ticket
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/release/bundle/macos/Limo CAD.app"
          signature_details="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application:' <<< "$signature_details"; then
            echo "$signature_details"
            echo "Production app is not signed by a Developer ID Application identity." >&2
            exit 1
          fi
          team_id="$(sed -n 's/^TeamIdentifier=//p' <<< "$signature_details")"
          if [[ -z "$team_id" || "$team_id" == "not set" ]]; then
            echo "$signature_details"
            echo "Production signature has no Apple Team ID." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify packaged architecture and launch
        shell: bash
        run: |
          app="desktop/target/release/bundle/macos/Limo CAD.app"
          executable="$app/Contents/MacOS/limo-cad"
          if ! lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64; then
            echo "Packaged executable is not Apple silicon:" >&2
            lipo -info "$executable" >&2
            exit 1
          fi

          log="$RUNNER_TEMP/limo-cad-macos-smoke.log"
          "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged application exited during launch smoke test (code $status)" >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
            exit "$status"
          fi
          kill "$pid"
          wait "$pid" || true
          cat "$log"

      - name: Verify packaged MCP without GUI initialization
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find desktop/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/limo-cad-mcp-dmg"
          stage="$GITHUB_WORKSPACE/desktop/occt-libs"
          hidden_stage="$GITHUB_WORKSPACE/desktop/occt-libs.mcp-verification"
          test ! -e "$hidden_stage"
          mkdir -p "$mount"
          stage_moved=false
          cleanup_mcp_package() {
            if [[ "$stage_moved" == true ]]; then mv "$hidden_stage" "$stage"; fi
            hdiutil detach "$mount" || true
          }
          trap cleanup_mcp_package EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          python3 - "$mount/Limo CAD.app/Contents/Info.plist" "$RUNNER_TEMP/limo-cad-macos-uri.json" <<'PY'
          import json, plistlib, sys
          with open(sys.argv[1], 'rb') as file:
              info = plistlib.load(file)
          schemes = [scheme for entry in info.get('CFBundleURLTypes', [])
                     for scheme in entry.get('CFBundleURLSchemes', [])]
          if 'limo-cad' not in schemes or info.get('CFBundleExecutable') != 'limo-cad':
              raise SystemExit('Packaged app is missing its limo-cad recipe URI association')
          with open(sys.argv[2], 'w') as file:
              json.dump({'scheme': 'limo-cad', 'executable': info['CFBundleExecutable'],
                         'status': 'declared-in-dmg'}, file, indent=2)
          PY
          mv "$stage" "$hidden_stage"
          stage_moved=true
          cargo xtask verify-package-mcp \
            --server "$mount/Limo CAD.app/Contents/MacOS/limo-cad" \
            --server-arg --headless --desktop --out "$RUNNER_TEMP/limo-cad-mcp-macos.json"

      - name: Upload macOS MCP verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-macos-mcp-diagnostics
          path: |
            ${{ runner.temp }}/limo-cad-mcp-macos.json
            ${{ runner.temp }}/limo-cad-macos-uri.json
          if-no-files-found: warn
          retention-days: 7

      - name: Create checksum
        shell: bash
        run: |
          dmg="$(find desktop/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "DMG was not created" >&2
            exit 1
          fi
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (
            cd "$dmg_directory"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

      - name: Upload Apple silicon release
        uses: actions/upload-artifact@v4
        with:
          name: Limo-CAD-${{ steps.app_version.outputs.version }}-macos-arm64
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/dmg/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove Apple signing credentials
        if: always() && env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/limo-cad-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/limo-cad-signing-certificate.p12" \
            "$RUNNER_TEMP/limo-cad-notary-api-key.p8"

  publish_release:
    name: Publish the tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-portable
      - build-linux-ubuntu
      - build-linux-appimage
      - verify-linux-appimage
      - build-macos-apple-silicon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out Limo CAD
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Refuse a release tag that does not name VERSION on main
        run: cargo xtask check-release-tag "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Download this run's packages
        uses: actions/download-artifact@v4
        with:
          pattern: Limo-CAD-*
          path: dist
          merge-multiple: false

      - name: Verify every package against its checksum
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r sum; do
            perl -pi -e 's/\r$//' "$sum"
            ( cd "$(dirname "$sum")" && shasum -a 256 -c "$(basename "$sum")" )
            checked=$((checked + 1))
          done < <(find dist -type f -name '*.sha256' ! -path '*diagnostics*' | sort)
          test "$checked" -eq 5

      - name: Reject control-enabled or mismatched Windows release packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -type f -name '*.zip' ! -path '*diagnostics*' | sort)
          python3 scripts/ci/verify-default-windows-package.py --version "$(cat VERSION)" --revision "$GITHUB_SHA" "${packages[@]}"

      - name: Publish packages, checksums and notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing; commit the release notes with the version bump."
            exit 1
          fi
          published_notes="$RUNNER_TEMP/release-notes.md"
          sed "s/{{commit}}/${GITHUB_SHA}/g" "$notes" > "$published_notes"

          binaries=()
          while IFS= read -r binary; do binaries+=("$binary"); done < <(find dist -type f \
            \( -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            ! -path '*diagnostics*' | sort)
          test "${#binaries[@]}" -eq 5
          sums=()
          while IFS= read -r sum; do sums+=("$sum"); done < <(find dist -type f -name '*.sha256' ! -path '*diagnostics*' | sort)

          : > dist/SHA256SUMS.txt
          for binary in "${binaries[@]}"; do
            printf '%s  %s\n' "$(shasum -a 256 "$binary" | cut -d' ' -f1)" "$(basename "$binary")" \
              >> dist/SHA256SUMS.txt
          done
          sort -k2 dist/SHA256SUMS.txt -o dist/SHA256SUMS.txt

          if [[ "$tag" == *-* ]]; then
            channel=(--prerelease)
          else
            channel=(--latest)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Limo CAD ${tag#v}" \
              --notes-file "$published_notes"
          else
            gh release create "$tag" \
              --title "Limo CAD ${tag#v}" \
              --notes-file "$published_notes" \
              --verify-tag \
              --draft
          fi

          gh release upload "$tag" "${binaries[@]}" "${sums[@]}" dist/SHA256SUMS.txt --clobber

          uploaded="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$uploaded" -eq 11
          gh release edit "$tag" --draft=false "${channel[@]}"

          {
            echo "### Published \`$tag\`"
            echo
            gh release view "$tag" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
