name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      macos_signing:
        description: macOS signing mode
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - production
  pull_request:
  push:
    tags:
      - "v*"

env:
  NBCAD_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  # Finish expensive SDK/build work so its caches and diagnostics survive a
  # follow-up fix. GitHub retains only the newest pending run for this group.
  cancel-in-progress: false

jobs:
  version_preflight:
    uses: ./.github/workflows/version-guard.yml

  classify_changes:
    name: Classify desktop build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows_should_build: ${{ steps.classify.outputs.windows_should_build }}
      macos_should_build: ${{ steps.classify.outputs.macos_should_build }}
      linux_should_build: ${{ steps.classify.outputs.linux_should_build }}
    steps:
      - name: Inspect changed paths
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info(`${context.eventName} runs always build all desktop packages.`);
              core.setOutput("windows_should_build", "true");
              core.setOutput("macos_should_build", "true");
              core.setOutput("linux_should_build", "true");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const commonBuildInputs = [
              {
                pattern: /^(src-tauri|crates|src\/i18n|src\/assets\/ribbon-icons)\//,
                reason: "application or native source",
              },
              {
                pattern: /^(mcp-server|knowledge|interface|examples\/scripts|xtask)\//,
                reason: "embedded MCP library or knowledge, interface catalog, native script, or package verifier",
              },
              {
                pattern: /^\.github\/actions\//,
                reason: "shared GitHub Action",
              },
              {
                pattern: /^\.github\/workflows\/desktop-packages\.yml$/,
                reason: "desktop packaging workflow",
              },
              {
                pattern:
                  /^(Cargo\.toml|Cargo\.lock|vcpkg\.json|rust-toolchain(?:\.toml)?)$/,
                reason: "build or dependency configuration",
              },
              {
                pattern: /^(LICENSE|THIRD_PARTY_NOTICES\.md)$/,
                reason: "bundled legal notice",
              },
            ];

            const platformMatches = (platformInputs) =>
              files.flatMap(({ filename }) => {
                const rule = [...commonBuildInputs, ...platformInputs].find(
                  ({ pattern }) => pattern.test(filename),
                );
                return rule ? [`${filename} (${rule.reason})`] : [];
              });

            const windowsMatches = platformMatches([
              {
                pattern: /^scripts\/verify-windows-viewport\.ps1$/,
                reason: "Windows packaging script",
              },
            ]);
            const macosMatches = platformMatches([]);
            const linuxMatches = platformMatches([
              {
                pattern: /^scripts\/(?:build-occt-linux\.sh|verify-linux-(?:viewport|native-package)\.sh)$/,
                reason: "Linux packaging, OCCT build or native package verification script",
              },
              {
                pattern: /^scripts\/docker\/(?:ubuntu-26\.04|appimage-ubuntu-22\.04)\.Dockerfile$/,
                reason: "Linux build SDK",
              },
            ]);

            const report = (platform, output, matches) => {
              const shouldBuild = matches.length > 0;
              core.setOutput(output, String(shouldBuild));
              if (shouldBuild) {
                core.info(`${platform} build required by:\n${matches.join("\n")}`);
              } else {
                core.info(
                  `Skipping ${platform} build; none of ${files.length} changed files affect that packaged application.`,
                );
              }
            };

            report("Windows", "windows_should_build", windowsMatches);
            report("macOS", "macos_should_build", macosMatches);
            report("Linux", "linux_should_build", linuxMatches);

  build-windows-portable:
    name: Windows ${{ matrix.architecture }} portable ZIP
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.windows_should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            runner_cache_key: windows-2025-x64-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - architecture: arm64
            runner: windows-11-vs2026-arm
            runner_cache_key: windows-11-vs2026-arm-arm64-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      # Pull-request/manual packages retain symbols for diagnostics. A v* tag
      # is the production boundary and must ship a stripped Rust executable.
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Set up cached OpenCASCADE SDK
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: ${{ matrix.vcpkg_triplet }}
          runner-cache-key: ${{ matrix.runner_cache_key }}
          msvc-component: ${{ matrix.msvc_component }}

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust targets
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Build portable ZIP
        shell: pwsh
        env:
          OCCT_ROOT: ${{ steps.occt.outputs.root }}
        run: |
          cargo xtask package --target "${{ matrix.rust_target }}"
          if ($LASTEXITCODE -ne 0) { throw "Native portable build failed" }

      - name: Verify packaged MCP without an OCCT SDK
        shell: pwsh
        run: |
          $archive = Get-ChildItem "src-tauri\target\${{ matrix.rust_target }}\release\bundle\portable" -Filter "*.zip" -File
          if (@($archive).Count -ne 1) { throw "Expected one portable ZIP" }
          $verifyRoot = Join-Path $env:RUNNER_TEMP "nbcad-mcp-package-${{ matrix.architecture }}"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $verifyRoot
          $executable = Get-ChildItem -LiteralPath $verifyRoot -Filter "noBS-CAD.exe" -File -Recurse
          if (@($executable).Count -ne 1) { throw "Expected one packaged executable" }
          $uriKey = 'HKEY_CURRENT_USER\Software\Classes\nbcad\shell\open\command'
          $uriBefore = [Microsoft.Win32.Registry]::GetValue($uriKey, '', $null)
          cargo xtask verify-package-mcp --server $executable.FullName --server-arg --headless --out "$env:RUNNER_TEMP\nbcad-viewport-diagnostics\${{ matrix.architecture }}\mcp.json"
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP verification failed" }
          if ([Microsoft.Win32.Registry]::GetValue($uriKey, '', $null) -cne $uriBefore) {
            throw "Headless MCP changed the desktop URI handler"
          }

      - name: Verify packaged native viewport
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "nbcad-mcp-package-${{ matrix.architecture }}"
          $executable = Get-ChildItem -LiteralPath $verifyRoot -Filter 'noBS-CAD.exe' -File -Recurse
          if (@($executable).Count -ne 1) { throw "Expected one extracted packaged executable" }
          cargo xtask verify-package-mcp --server $executable.FullName --server-arg --headless --desktop --out "$env:RUNNER_TEMP\nbcad-viewport-diagnostics\${{ matrix.architecture }}\desktop-stdio.json"
          if ($LASTEXITCODE -ne 0) { throw "Default desktop stdio verification failed" }
          & .\scripts\verify-windows-viewport.ps1 `
            -PackageDirectory $executable.DirectoryName `
            -DiagnosticsDirectory "$env:RUNNER_TEMP\nbcad-viewport-diagnostics\${{ matrix.architecture }}"
          # This normal launch runs on an ephemeral GitHub runner account.
          # The quoted URL placeholder supplies one argument to the strict parser.
          $uriBase = 'HKEY_CURRENT_USER\Software\Classes\nbcad'
          $handler = [Microsoft.Win32.Registry]::GetValue("$uriBase\shell\open\command", '', $null)
          $expected = '"' + $executable.FullName + '" "%1"'
          if (-not [string]::Equals($handler, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Recipe URI handler does not point to the extracted package: $handler"
          }
          if ($null -eq [Microsoft.Win32.Registry]::GetValue($uriBase, 'URL Protocol', $null)) {
            throw "Recipe URI protocol marker is missing"
          }
          @{scheme='nbcad';command=$handler;status='registered'} | ConvertTo-Json |
            Set-Content "$env:RUNNER_TEMP\nbcad-viewport-diagnostics\${{ matrix.architecture }}\recipe-uri.json"

      - name: Upload Windows viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-windows-${{ matrix.architecture }}-viewport-diagnostics
          path: ${{ runner.temp }}\nbcad-viewport-diagnostics\${{ matrix.architecture }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-${{ steps.app_version.outputs.version }}-windows-${{ matrix.architecture }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/portable/*.zip
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/portable/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-ubuntu:
    name: Ubuntu 26.04 x64 DEB
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Ubuntu desktop SDK
        uses: ./.github/actions/setup-linux-desktop
        with:
          desktop-input: 'true'

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            linux-ubuntu-26.04-${{ runner.arch }}-

      - name: Build and audit Linux packages
        shell: bash
        run: |
          set -euo pipefail
          # Rust cache restores include old bundle outputs. Preserve compiled
          # dependencies, but never smoke-test or upload a previous package.
          bundle_root="$(realpath -m src-tauri/target/release/bundle)"
          test "$bundle_root" = "$GITHUB_WORKSPACE/src-tauri/target/release/bundle"
          rm -rf -- "$bundle_root/deb" "$bundle_root/appimage"
          # The AppImage is built by build-linux-appimage on Ubuntu 22.04.
          cargo xtask package --bundle deb
          test "$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Verify DEB MCP without a display
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          mcp_root="$RUNNER_TEMP/nbcad-mcp-deb"
          mkdir -p "$mcp_root"
          dpkg-deb -x "$deb" "$mcp_root"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$mcp_root/usr/bin/nbcad" --server-arg --headless \
            --out "$RUNNER_TEMP/nbcad-linux-viewport-diagnostics/mcp-deb.json"

      - name: Verify packaged native interface on X11 and Wayland
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "$deb" ]]; then
            echo "Debian package was not created" >&2
            exit 1
          fi
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$deb" \
            x11 \
            "$RUNNER_TEMP/nbcad-linux-viewport-diagnostics/x11"
          scripts/verify-linux-viewport.sh \
            "$deb" \
            wayland \
            "$RUNNER_TEMP/nbcad-linux-viewport-diagnostics/wayland"
          vulkan_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- \
            env WGPU_BACKEND=vulkan VK_ICD_FILENAMES="$vulkan_icd" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo xtask verify-package-mcp \
              --server "$RUNNER_TEMP/nbcad-mcp-deb/usr/bin/nbcad" --server-arg --headless --desktop \
              --out "$RUNNER_TEMP/nbcad-linux-viewport-diagnostics/desktop-stdio.json"

      - name: Upload Linux viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-linux-viewport-diagnostics
          path: ${{ runner.temp }}/nbcad-linux-viewport-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ubuntu release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-${{ steps.app_version.outputs.version }}-ubuntu-26.04-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-appimage:
    name: Linux x64 AppImage (Ubuntu 22.04 build)
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-latest
    # Keep the glibc baseline compatible with supported desktop runtimes.
    # Graphics/window loaders remain host libraries. Build on the oldest supported
    # Ubuntu; scripts/docker/appimage-ubuntu-22.04.Dockerfile is the same SDK.
    container: ubuntu:22.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}
      DEBIAN_FRONTEND: noninteractive
      OCCT_ROOT: /opt/opencascade
      # linuxdeploy resolves the OCCT libraries it bundles through this path.
      LD_LIBRARY_PATH: /opt/opencascade/lib

    steps:
      - name: Install Ubuntu 22.04 build SDK
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            dbus-x11 \
            desktop-file-utils \
            file \
            git \
            libdbus-1-3 \
            libfontconfig-dev \
            libfreetype-dev \
            libfuse2 \
            libssl-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb1 \
            libxcursor1 \
            libxi6 \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            mesa-vulkan-drivers \
            ninja-build \
            patchelf \
            squashfs-tools \
            vulkan-tools \
            xauth \
            xclip \
            xdg-utils \
            xdotool \
            xvfb \
            xz-utils \
            zenity \
            zstd

      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore OCCT 7.9 build
        id: occt
        uses: actions/cache@v4
        with:
          path: /opt/opencascade
          key: occt-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/build-occt-linux.sh') }}

      - name: Build OCCT 7.9 from pinned source
        if: steps.occt.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/build-occt-linux.sh /opt/opencascade

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-appimage-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'crates/**/Cargo.toml', 'scripts/build-occt-linux.sh') }}
          restore-keys: |
            linux-appimage-ubuntu-22.04-${{ runner.arch }}-

      - name: Build and audit the AppImage
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$(realpath -m src-tauri/target/release/bundle)"
          test "$bundle_root" = "$GITHUB_WORKSPACE/src-tauri/target/release/bundle"
          rm -rf -- "$bundle_root/deb" "$bundle_root/appimage"
          cargo xtask package --bundle appimage
          test "$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1

      - name: Refuse an AppImage that needs a newer glibc than Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          work="$(mktemp -d)"
          ( cd "$work" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null )
          required="$(find "$work/squashfs-root" -type f -print0 \
            | xargs -0 file --no-pad --separator '|' | grep '|.*ELF' | cut -d'|' -f1 \
            | xargs -d '\n' sh -c 'for elf; do objdump -T "$elf" 2>/dev/null || true; done' _ \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -n 1)"
          rm -rf "$work"
          echo "Newest glibc symbol version required: $required"
          test -n "$required"
          test "$(printf '%s\n' "$required" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35

      - name: Verify AppImage MCP without a display
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$appimage" --server-arg --appimage-extract-and-run --server-arg --headless \
            --out "$RUNNER_TEMP/nbcad-linux-appimage-diagnostics/mcp-appimage.json"

      - name: Verify packaged native viewport on X11
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$appimage" \
            x11 \
            "$RUNNER_TEMP/nbcad-linux-appimage-diagnostics/x11"

      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-linux-appimage-diagnostics
          path: ${{ runner.temp }}/nbcad-linux-appimage-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AppImage release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-${{ steps.app_version.outputs.version }}-linux-x64-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-linux-appimage:
    name: Linux x64 AppImage on Ubuntu 26.04
    needs: [classify_changes, build-linux-appimage]
    if: needs.classify_changes.outputs.linux_should_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # AppImages use the host's graphics/window loaders and Wayland client ABI.
      # Winit dlopens X11 cursor/input libraries; GTK no longer supplies them.
      # The hosted runner is a minimal server image, so install that desktop
      # runtime contract explicitly along with the headless display and
      # software Vulkan driver; the AppImage must bring everything else.
      - name: Install Ubuntu 26.04 headless desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            dbus-x11 \
            desktop-file-utils \
            libegl1 \
            libdbus-1-3 \
            libx11-6 \
            libx11-xcb1 \
            libxcursor1 \
            libxi6 \
            libxkbcommon-x11-0 \
            libvulkan1 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            mesa-vulkan-drivers \
            xauth \
            xclip \
            xdg-utils \
            xdotool \
            xvfb \
            zenity

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: noBS-CAD-${{ steps.app_version.outputs.version }}-linux-x64-appimage
          path: ${{ runner.temp }}/appimage

      - name: Verify AppImage MCP and native viewport on X11
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$RUNNER_TEMP/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          ( cd "$RUNNER_TEMP/appimage" && sha256sum -c ./*.AppImage.sha256 )
          chmod +x "$appimage"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo xtask verify-package-mcp \
            --server "$appimage" --server-arg --appimage-extract-and-run --server-arg --headless \
            --out "$RUNNER_TEMP/nbcad-linux-appimage-26.04-diagnostics/mcp-appimage.json"
          chmod +x scripts/verify-linux-viewport.sh
          scripts/verify-linux-viewport.sh \
            "$appimage" \
            x11 \
            "$RUNNER_TEMP/nbcad-linux-appimage-26.04-diagnostics/x11"

      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-linux-appimage-26.04-diagnostics
          path: ${{ runner.temp }}/nbcad-linux-appimage-26.04-diagnostics
          if-no-files-found: warn
          retention-days: 7

  build-macos-apple-silicon:
    name: macOS Apple silicon DMG
    needs: [classify_changes, version_preflight]
    if: needs.classify_changes.outputs.macos_should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Tags are always production builds. A manual production run is the
      # credential/notarization dry-run path before creating a release tag.
      MACOS_DISTRIBUTION_BUILD: >-
        ${{ github.ref_type == 'tag' ||
            (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production') }}
      CARGO_PROFILE_RELEASE_STRIP: >-
        ${{ (github.ref_type == 'tag' ||
             (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production')) &&
            'symbols' || 'none' }}

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Verify Apple silicon runner
        shell: bash
        run: |
          architecture="$(uname -m)"
          if [[ "$architecture" != "arm64" ]]; then
            echo "Expected an Apple silicon runner, got $architecture" >&2
            exit 1
          fi

      - name: Read the application version
        id: app_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Install pinned OpenCASCADE 7.9.3
        shell: bash
        run: |
          brew install opencascade
          occt_version="$(brew list --versions opencascade | awk '{ print $2 }')"
          if [[ "$occt_version" != "7.9.3" ]]; then
            echo "Expected OpenCASCADE 7.9.3, got $occt_version" >&2
            exit 1
          fi
          echo "OCCT_ROOT=$(brew --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Import Developer ID Application certificate
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE repository secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD repository secret}"

          certificate_path="$RUNNER_TEMP/nbcad-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/nbcad-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" |
            openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(Developer ID Application: .+)"$/\1/p' |
              sed -n '1p'
          )"
          if [[ -z "$signing_identity" ]]; then
            security find-identity -v -p codesigning "$keychain_path"
            echo "The imported archive does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "Imported production signing identity: $signing_identity"

      - name: Prepare App Store Connect notarization key
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER repository secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY repository secret}"
          : "${APPLE_API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY repository secret}"

          api_key_path="$RUNNER_TEMP/nbcad-notary-api-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"; then
            echo "APPLE_API_PRIVATE_KEY is not an App Store Connect .p8 private key." >&2
            exit 1
          fi

      - name: Build ad-hoc signed DMG
        if: env.MACOS_DISTRIBUTION_BUILD != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo xtask package

      - name: Build Developer ID signed and notarized DMG
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/nbcad-notary-api-key.p8
        run: cargo xtask package

      - name: Verify Developer ID signature and notarization ticket
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/noBS CAD.app"
          signature_details="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application:' <<< "$signature_details"; then
            echo "$signature_details"
            echo "Production app is not signed by a Developer ID Application identity." >&2
            exit 1
          fi
          team_id="$(sed -n 's/^TeamIdentifier=//p' <<< "$signature_details")"
          if [[ -z "$team_id" || "$team_id" == "not set" ]]; then
            echo "$signature_details"
            echo "Production signature has no Apple Team ID." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify packaged architecture and launch
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/noBS CAD.app"
          executable="$app/Contents/MacOS/nbcad"
          if ! lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64; then
            echo "Packaged executable is not Apple silicon:" >&2
            lipo -info "$executable" >&2
            exit 1
          fi

          log="$RUNNER_TEMP/nbcad-macos-smoke.log"
          "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged application exited during launch smoke test (code $status)" >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
            exit "$status"
          fi
          kill "$pid"
          wait "$pid" || true
          cat "$log"

      - name: Verify packaged MCP without GUI initialization
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/nbcad-mcp-dmg"
          stage="$GITHUB_WORKSPACE/src-tauri/occt-libs"
          hidden_stage="$GITHUB_WORKSPACE/src-tauri/occt-libs.mcp-verification"
          test ! -e "$hidden_stage"
          mkdir -p "$mount"
          stage_moved=false
          cleanup_mcp_package() {
            if [[ "$stage_moved" == true ]]; then mv "$hidden_stage" "$stage"; fi
            hdiutil detach "$mount" || true
          }
          trap cleanup_mcp_package EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          # Audit the actual DMG's LaunchServices metadata, not generated config.
          python3 - "$mount/noBS CAD.app/Contents/Info.plist" "$RUNNER_TEMP/nbcad-macos-uri.json" <<'PY'
          import json, plistlib, sys
          with open(sys.argv[1], 'rb') as file:
              info = plistlib.load(file)
          schemes = [scheme for entry in info.get('CFBundleURLTypes', [])
                     for scheme in entry.get('CFBundleURLSchemes', [])]
          if 'nbcad' not in schemes or info.get('CFBundleExecutable') != 'nbcad':
              raise SystemExit('Packaged app is missing its nbcad recipe URI association')
          with open(sys.argv[2], 'w') as file:
              json.dump({'scheme': 'nbcad', 'executable': info['CFBundleExecutable'],
                         'status': 'declared-in-dmg'}, file, indent=2)
          PY
          # The executable has a build-time rpath as well as its portable one.
          # Hide that generated staging directory to require the DMG's libraries.
          mv "$stage" "$hidden_stage"
          stage_moved=true
          cargo xtask verify-package-mcp \
            --server "$mount/noBS CAD.app/Contents/MacOS/nbcad" \
            --server-arg --headless --desktop --out "$RUNNER_TEMP/nbcad-mcp-macos.json"

      - name: Upload macOS MCP verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-macos-mcp-diagnostics
          path: |
            ${{ runner.temp }}/nbcad-mcp-macos.json
            ${{ runner.temp }}/nbcad-macos-uri.json
          if-no-files-found: warn
          retention-days: 7

      - name: Create checksum
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "DMG was not created" >&2
            exit 1
          fi
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (
            cd "$dmg_directory"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

      - name: Upload Apple silicon release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-${{ steps.app_version.outputs.version }}-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove Apple signing credentials
        if: always() && env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nbcad-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/nbcad-signing-certificate.p12" \
            "$RUNNER_TEMP/nbcad-notary-api-key.p8"

  # Only a pushed `v*` tag publishes. The runner already holds every package it
  # built, so the assets never travel through a workstation, and a flaky local
  # connection cannot half-publish a release. A manual run on a tag rebuilds for
  # diagnosis only and never rewrites a published release.
  publish_release:
    name: Publish the tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-portable
      - build-linux-ubuntu
      - build-linux-appimage
      - verify-linux-appimage
      - build-macos-apple-silicon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The repository default stays read-only; this job alone may write the
      # release. It never touches the branch.
      contents: write
    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # version_preflight already refused a bad tag before the package matrix;
      # this is the job holding `contents: write`, so it decides again for
      # itself before anything is published.
      - name: Refuse a release tag that does not name VERSION on main
        run: cargo xtask check-release-tag "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Download this run's packages
        uses: actions/download-artifact@v4
        with:
          # Every artifact keeps its own `dist/<artifact name>/` directory, so
          # the `*-viewport-diagnostics` and `*-mcp-diagnostics` artifacts that
          # match this pattern too are excluded by path below.
          pattern: noBS-CAD-*
          path: dist
          merge-multiple: false

      - name: Verify every package against its checksum
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r sum; do
            # One LF per line: `shasum -c` here, and on a user's machine, reads
            # a trailing CR as part of the file name and reports the package
            # missing. Older Windows bundles wrote CRLF.
            perl -pi -e 's/\r$//' "$sum"
            ( cd "$(dirname "$sum")" && shasum -a 256 -c "$(basename "$sum")" )
            checked=$((checked + 1))
          done < <(find dist -type f -name '*.sha256' ! -path '*diagnostics*' | sort)
          # Windows x64/ARM64, macOS, DEB and AppImage. A missing platform means
          # the release must not go out with a gap in it.
          test "$checked" -eq 5

      - name: Publish packages, checksums and notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing; commit the release notes with the version bump."
            exit 1
          fi
          # The notes are written before the tag exists, so the tag's commit is
          # substituted here. `{{commit}}` is optional.
          published_notes="$RUNNER_TEMP/release-notes.md"
          sed "s/{{commit}}/${GITHUB_SHA}/g" "$notes" > "$published_notes"

          binaries=()
          while IFS= read -r binary; do binaries+=("$binary"); done < <(find dist -type f \
            \( -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            ! -path '*diagnostics*' | sort)
          test "${#binaries[@]}" -eq 5
          sums=()
          while IFS= read -r sum; do sums+=("$sum"); done < <(find dist -type f -name '*.sha256' ! -path '*diagnostics*' | sort)

          # SHA256SUMS.txt covers the installed packages, with bare file names,
          # which is the shape the previous release pages use.
          : > dist/SHA256SUMS.txt
          for binary in "${binaries[@]}"; do
            printf '%s  %s\n' "$(shasum -a 256 "$binary" | cut -d' ' -f1)" "$(basename "$binary")" \
              >> dist/SHA256SUMS.txt
          done
          sort -k2 dist/SHA256SUMS.txt -o dist/SHA256SUMS.txt

          # A pre-release tag such as v0.3.0-rc.1 must not take the Latest badge.
          if [[ "$tag" == *-* ]]; then
            channel=(--prerelease)
          else
            channel=(--latest)
          fi

          # A new release stays a draft until every asset is attached, so the
          # public page, the Latest badge and watcher notifications never show
          # an incomplete release. A re-run edits the existing release in place.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "noBS CAD ${tag#v}" \
              --notes-file "$published_notes"
          else
            gh release create "$tag" \
              --title "noBS CAD ${tag#v}" \
              --notes-file "$published_notes" \
              --verify-tag \
              --draft
          fi

          # Idempotent: a re-run of the same tag replaces what it uploaded before.
          gh release upload "$tag" "${binaries[@]}" "${sums[@]}" dist/SHA256SUMS.txt --clobber

          # Five packages, five checksums and SHA256SUMS.txt: publish only once
          # all of them are attached.
          uploaded="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$uploaded" -eq 11
          gh release edit "$tag" --draft=false "${channel[@]}"

          {
            echo "### Published \`$tag\`"
            echo
            gh release view "$tag" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
