[package]
name = "limo-cad"
default-run = "limo-cad"
version = "0.3.0-rc.1"
edition = "2021"
description = "Limo CAD native Bevy desktop"
license = "LGPL-2.1-or-later"
repository = "https://github.com/limo-cad/Limo-CAD"

[workspace]

[patch.crates-io]
# Explicit service wakes must advance the app even when the OS suppresses redraws.
bevy_winit = { path = "vendor/bevy_winit" }

[profile.release]
strip = "symbols"

[lib]
name = "limo_cad"
crate-type = ["rlib"]

[features]
default = []
native-computer-control = ["limo-cad-mcp/native-computer-control"]
dev-ui-lab = ["bevy/bevy_log"]
dev-native-ime-trace = ["bevy/bevy_log"]
# WIP headless widget behavior using the existing native styling and ownership route.
experimental-ui-widgets = []

[[bin]]
name = "bevy-ui-lab"
path = "src/bin/bevy_ui_lab.rs"
required-features = ["dev-ui-lab"]

[build-dependencies]
winresource = "=0.1.34"

[dependencies]
limo-cad-session-storage = { path = "../crates/session-storage" }
limo-cad-build-info = { path = "../crates/build-info" }
time = { version = "=0.3.55", features = ["formatting"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
dirs = "7.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
base64 = "0.23.1"
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts"] }
uuid = { version = "1.28.0", features = ["v4"] }
limo-cad-core = { path = "../crates/core" }
limo-cad-interface = { path = "../crates/interface" }
limo-cad-project-file = { path = "../crates/project-file" }
limo-cad-cam = { path = "../crates/cam" }
limo-cad-sketch = { path = "../crates/sketch" }
limo-cad-solid = { path = "../crates/solid" }
limo-cad-export = { path = "../crates/export" }
limo-cad-occt = { path = "../crates/occt", features = ["native-occt"] }
limo-cad-native-engine = { path = "../crates/native-engine", features = ["native-occt"] }
limo-cad-mcp-mutate = { path = "../crates/mcp-mutate" }
limo-cad-mcp = { package = "limo-cad-mcp", path = "../mcp-server" }
earcutr = "=0.5.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
  "bevy_winit",
  "bevy_input_focus",
  "bevy_ui_widgets",
  "ui_picking",
  "custom_cursor",
  "system_clipboard",
  "complex_script_segmentation",
  "system_font_discovery",
  "x11",
  "wayland",
  "accesskit_unix",
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_image",
  "bevy_light",
  "bevy_material",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "default_font",
  "hdr",
  "multi_threaded",
  "png",
  "std",
  "tonemapping_luts",
  # Bevy's ruzstd 0.8 decoder is affected by RUSTSEC-2026-0344.
  # Keep compressed KTX2/tonemapping support using the native zstd backend.
  "zstd_c",
] }
bevy_ecs = "=0.20.0"
bevy_gizmos = "=0.20.0"
bevy_reflect = "=0.20.0"
# Native renderers share a device across threads. Bevy disables wgpu's default
# features; std is required for wgpu's documented thread-local error scopes.
wgpu = { version = "=30.0.1", default-features = false, features = ["std"] }
raw-window-handle = "0.6.2"
# Bevy 0.20 exposes AccessKit 0.24 nodes and action requests without re-exporting
# the crate. Keep the same types at that boundary until Bevy upgrades AccessKit.
accesskit = { version = "=0.24.1" }
svg2pdf = { version = "=0.13.0", default-features = false }
winit = { version = "=0.30.13", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1.53.3", features = ["time", "rt"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "print", "raw_handle", "wayland"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSApplication", "NSPrintOperation", "NSPrintInfo", "NSPrinter", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSString", "NSGeometry", "NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Registry", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
